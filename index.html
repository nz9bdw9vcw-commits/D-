<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小編日報</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #1a1a1a;
      --text-soft: #444;
      --text-meta: #999;
      --border: #eeeeee;
      --border-strong: #ddd;
      --accent: #c00;
      --accent-dark: #a00;
      --btn-bg: #eeeeee;
      --btn-text: #333333;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --danger-bg: #ffeeee;
      --danger-text: #cc0000;
      --shadow: rgba(0,0,0,.06);
      --shadow-lg: rgba(0,0,0,.08);
    }

    html.dark {
      --bg: #000000;
      --card: #0d0d0d;
      --text: #f0f0f0;
      --text-soft: #b8b8b8;
      --text-meta: #7a7a7a;
      --border: #1f1f1f;
      --border-strong: #2e2e2e;
      --accent: #ff5c5c;
      --accent-dark: #ff8080;
      --btn-bg: #1a1a1a;
      --btn-text: #e0e0e0;
      --input-bg: #141414;
      --input-border: #2a2a2a;
      --danger-bg: #2a1010;
      --danger-text: #ff8080;
      --shadow: rgba(0,0,0,.5);
      --shadow-lg: rgba(0,0,0,.7);
    }

    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      font-family: system-ui, -apple-system, "PingFang TC", sans-serif;
      max-width: 780px; margin: 0 auto; padding: 0 16px 60px;
      line-height: 1.7; color: var(--text);
      transition: background .2s, color .2s;
    }

    header {
      background: var(--card);
      border-bottom: 3px solid var(--accent);
      padding: 16px 0 12px; margin-bottom: 24px;
      position: sticky; top: 0; z-index: 10;
    }
    .head-inner {
      max-width: 780px; margin: 0 auto; padding: 0 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { font-size: 26px; font-weight: 900; color: var(--accent); letter-spacing: 2px; cursor: pointer; }
    .logo span { color: var(--text); }
    .head-actions { display: flex; gap: 8px; align-items: center; }
    .head-actions button {
      font-size: 13px; padding: 6px 14px; border: none;
      border-radius: 4px; cursor: pointer; background: var(--btn-bg); color: var(--btn-text);
    }
    .btn-login { background: var(--accent); color: #fff !important; }
    .btn-logout { background: var(--btn-bg); color: var(--accent) !important; }
    .btn-theme { font-size: 16px !important; padding: 6px 10px !important; line-height: 1; }

    nav.cats {
      background: var(--card); border-bottom: 1px solid var(--border);
      margin-bottom: 20px; overflow-x: auto; white-space: nowrap;
    }
    nav.cats .inner { max-width: 780px; margin: 0 auto; padding: 0 16px; }
    nav.cats button {
      background: none; border: none; padding: 14px 16px;
      font-size: 15px; cursor: pointer; color: var(--text-meta);
      border-bottom: 3px solid transparent;
    }
    nav.cats button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

    .card {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 20px; margin-bottom: 12px; border-radius: 6px;
      cursor: pointer; transition: box-shadow .15s, background .2s;
    }
    .card:hover { box-shadow: 0 2px 10px var(--shadow); }
    .card .cat {
      display: inline-block; font-size: 12px; color: var(--accent);
      border: 1px solid var(--accent); padding: 1px 6px;
      border-radius: 3px; margin-bottom: 8px;
    }
    .card h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.4; color: var(--text); }
    .card .meta { color: var(--text-meta); font-size: 13px; margin-bottom: 10px; }
    .card .summary { color: var(--text-soft); font-size: 15px; }
    .card .thumb-hint { color: var(--accent); font-size: 13px; margin-top: 8px; }

    #detail { background: var(--card); padding: 24px; border-radius: 6px; }
    #detail h1 { font-size: 26px; line-height: 1.35; margin: 0 0 12px; color: var(--text); }
    #detail .meta {
      color: var(--text-meta); font-size: 14px;
      border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px;
    }
    #detail .body { font-size: 16px; white-space: pre-wrap; line-height: 1.9; color: var(--text); }
    #back { display: inline-block; margin-bottom: 16px; color: var(--accent); cursor: pointer; font-size: 14px; }
    #back:hover { text-decoration: underline; }

    .share-bar {
      margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
    .share-bar button {
      background: var(--btn-bg); color: var(--btn-text); border: none;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .share-bar button:hover { opacity: .85; }

    .login-box {
      max-width: 340px; margin: 40px auto; background: var(--card);
      padding: 24px; border-radius: 8px; box-shadow: 0 2px 12px var(--shadow-lg);
    }
    .login-box h2 { text-align: center; margin: 0 0 16px; color: var(--text); }

    input, textarea, select {
      width: 100%; padding: 12px; margin: 6px 0;
      font-family: inherit; font-size: 15px;
      border: 1px solid var(--input-border); border-radius: 6px;
      background: var(--input-bg); color: var(--text);
    }
    textarea { height: 160px; resize: vertical; }
    button.primary {
      background: var(--accent); color: #fff; border: none;
      padding: 12px 20px; border-radius: 6px; font-size: 15px;
      cursor: pointer; width: 100%;
    }
    button.primary:hover { background: var(--accent-dark); }
    .msg { color: var(--accent); margin-top: 8px; font-size: 14px; text-align: center; }

    .editor-box {
      background: var(--card); padding: 24px; border-radius: 8px; margin-bottom: 20px;
    }
    .editor-box h2 { margin-top: 0; color: var(--text); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .admin-item {
      border-bottom: 1px solid var(--border); padding: 14px 0;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .admin-item .info { flex: 1; }
    .admin-item h3 { margin: 0 0 4px; font-size: 16px; color: var(--text); }
    .admin-item .meta { color: var(--text-meta); font-size: 12px; }
    .admin-item a { color: var(--accent); font-size: 12px; text-decoration: none; }
    .admin-item a:hover { text-decoration: underline; }
    .btn-del {
      background: var(--danger-bg); color: var(--danger-text); border: none;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    .empty { color: var(--text-meta); padding: 20px; text-align: center; }
    .hidden { display: none !important; }

    .comments-section {
      margin-top: 40px; padding-top: 24px;
      border-top: 2px solid var(--border);
    }
    .comments-section h3 {
      font-size: 18px; margin: 0 0 16px; color: var(--text);
    }
    .comment-form {
      background: var(--card); padding: 16px; border-radius: 8px;
      border: 1px solid var(--border); margin-bottom: 24px;
    }
    .comment-form textarea { height: 80px; }
    .comment-form button {
      background: var(--accent); color: #fff; border: none;
      padding: 10px 20px; border-radius: 6px; cursor: pointer;
      font-size: 14px; width: auto;
    }
    .comment-form button:hover { background: var(--accent-dark); }
    .comment-item {
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .comment-item .nick {
      font-weight: 700; color: var(--accent); font-size: 14px;
    }
    .comment-item .time {
      color: var(--text-meta); font-size: 12px; margin-left: 8px;
    }
    .comment-item .text {
      margin-top: 6px; color: var(--text-soft);
      white-space: pre-wrap; font-size: 15px;
    }
    .comment-item .del-btn {
      background: none; border: none; color: var(--text-meta);
      font-size: 12px; cursor: pointer; padding: 0; margin-top: 4px;
    }
    .comment-item .del-btn:hover { color: var(--danger-text); }
    .no-comment { color: var(--text-meta); font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="logo" id="logoBtn">小編<span>日報</span></div>
    <div class="head-actions">
      <button id="btnTheme" class="btn-theme" title="切換主題">🌙</button>
      <button id="btnLogin" class="btn-login">小編登入</button>
      <button id="btnLogout" class="btn-logout hidden">登出</button>
    </div>
  </div>
</header>

<nav class="cats" id="catNav">
  <div class="inner" id="catInner"></div>
</nav>

<div id="listView"></div>

<div id="detailView" class="hidden">
  <span id="back">← 返回列表</span>
  <div id="detail"></div>
</div>

<div id="loginView" class="login-box hidden">
  <h2>小編登入</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
  <button id="btnDoLogin" class="primary">登入</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="editorView" class="hidden">
  <div class="editor-box">
    <h2>發布新文章</h2>
    <input id="title" placeholder="標題">
    <div class="row">
      <select id="category">
        <option>考試</option>
        <option>學校</option>
        <option>生活</option>
        <option>其他</option>
        <option>八卦</option>
      </select>
      <input id="author" value="小編" placeholder="作者">
    </div>
    <input id="summary" placeholder="摘要（選填，列表會顯示這段）">
    <textarea id="content" placeholder="內文..."></textarea>
    <button id="btnAdd" class="primary">發布</button>
    <div class="msg" id="editMsg"></div>
  </div>
  <div class="editor-box">
    <h2>已發布文章</h2>
    <div id="adminList"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const supabase = createClient(
    'https://cfxwbghnwwtvuyodrrlj.supabase.co',
    'sb_publishable_iUkJIhqt_P8cu8WZdswqmw_59R0ZJ-_'
  )

  const $ = id => document.getElementById(id)
  const CATS = ['全部', '考試', '學校', '生活', '其他']
  const GOSSIP_PASSWORD = 'qazwsxedcrfvtgbyhnujmikolp'
  let currentCat = '全部'
  let isLoggedIn = false
  let gossipUnlocked = false

  function checkGossipUrl() {
    const params = new URLSearchParams(location.search)
    const g = params.get('gossip')
    if (g && g === GOSSIP_PASSWORD) {
      gossipUnlocked = true
      currentCat = '八卦'
      return true
    }
    return false
  }

  checkGossipUrl()

  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.classList.add('dark')
      $('btnTheme').textContent = '☀️'
    } else {
      document.documentElement.classList.remove('dark')
      $('btnTheme').textContent = '🌙'
    }
  }

  function initTheme() {
    const saved = localStorage.getItem('theme')
    if (saved) applyTheme(saved)
    else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      applyTheme(prefersDark ? 'dark' : 'light')
    }
  }

  $('btnTheme').onclick = () => {
    const isDark = document.documentElement.classList.contains('dark')
    const next = isDark ? 'light' : 'dark'
    applyTheme(next)
    localStorage.setItem('theme', next)
  }

  initTheme()

  function getIdFromUrl() {
    const params = new URLSearchParams(location.search)
    const id = params.get('id')
    return id ? parseInt(id, 10) : null
  }
  function setUrlId(id) {
    const params = new URLSearchParams(location.search)
    if (gossipUnlocked) params.set('gossip', GOSSIP_PASSWORD)
    if (id) params.set('id', id)
    else params.delete('id')
    const qs = params.toString()
    const url = qs ? `${location.pathname}?${qs}` : location.pathname
    history.pushState({ id }, '', url)
  }

  function renderCats() {
    $('catInner').innerHTML = CATS.map(c =>
      `<button data-cat="${c}" class="${c === currentCat ? 'active' : ''}">${c}</button>`
    ).join('')
    $('catInner').querySelectorAll('button').forEach(b => {
      b.onclick = () => { currentCat = b.dataset.cat; renderCats(); showList(true) }
    })
  }

  async function refreshAuth() {
    const { data: { session } } = await supabase.auth.getSession()
    isLoggedIn = !!session
    const hasIdParam = getIdFromUrl() !== null
    if (isLoggedIn && !hasIdParam) {
      $('btnLogin').classList.add('hidden')
      $('btnLogout').classList.remove('hidden')
      $('loginView').classList.add('hidden')
      $('editorView').classList.remove('hidden')
      $('listView').classList.add('hidden')
      $('detailView').classList.add('hidden')
      $('catNav').classList.add('hidden')
      loadAdmin()
    } else {
      if (isLoggedIn) {
        $('btnLogin').classList.add('hidden')
        $('btnLogout').classList.remove('hidden')
      } else {
        $('btnLogin').classList.remove('hidden')
        $('btnLogout').classList.add('hidden')
      }
      $('editorView').classList.add('hidden')
      $('catNav').classList.remove('hidden')
      route()
    }
  }

  function route() {
    const id = getIdFromUrl()
    if (id) openPost(id, false)
    else showList(false)
  }

  function showList(push) {
    if (push !== false) setUrlId(null)
    $('detailView').classList.add('hidden')
    $('loginView').classList.add('hidden')
    $('editorView').classList.add('hidden')
    $('listView').classList.remove('hidden')
    loadList()
  }

  async function openPost(id, push = true) {
    const { data, error } = await supabase.from('posts').select('*').eq('id', id).single()
    if (error || !data) {
      $('listView').innerHTML = '<div class="empty">找不到這篇文章。</div>'
      $('listView').classList.remove('hidden')
      $('detailView').classList.add('hidden')
      return
    }
    if (data.category === '八卦' && !gossipUnlocked && !isLoggedIn) {
      $('listView').innerHTML = '<div class="empty">找不到這篇文章。</div>'
      $('listView').classList.remove('hidden')
      $('detailView').classList.add('hidden')
      return
    }
    if (push) setUrlId(id)
    $('listView').classList.add('hidden')
    $('loginView').classList.add('hidden')
    $('editorView').classList.add('hidden')
    $('detailView').classList.remove('hidden')
    document.title = data.title + ' - 小編日報'
    $('detail').innerHTML = `
      <span class="cat" style="display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);padding:1px 6px;border-radius:3px;margin-bottom:10px">${esc(data.category || '未分類')}</span>
      <h1>${esc(data.title)}</h1>
      <div class="meta">${esc(data.author || '小編')} · ${new Date(data.created_at).toLocaleString('zh-TW')}</div>
      <div class="body">${esc(data.content || '')}</div>
      <div class="share-bar">
        <span style="color:var(--text-meta);font-size:13px">分享：</span>
        <button onclick="copyLink()">複製連結</button>
        <button onclick="shareNative()">分享…</button>
      </div>
      <div class="comments-section">
        <h3>留言</h3>
        <div class="comment-form">
          <input id="cNick" placeholder="你的暱稱" maxlength="20">
          <textarea id="cText" placeholder="想說點什麼..." maxlength="500"></textarea>
          <button onclick="submitComment(${data.id})">送出留言</button>
          <div class="msg" id="cMsg" style="text-align:left"></div>
        </div>
        <div id="commentList">載入留言中...</div>
      </div>
    `
    window.scrollTo(0, 0)
    loadComments(id)
  }
  window.openPost = openPost

  window.copyLink = async () => {
    try {
      await navigator.clipboard.writeText(location.href)
      alert('已複製連結！')
    } catch {
      prompt('複製這個連結：', location.href)
    }
  }
  window.shareNative = async () => {
    if (navigator.share) {
      try { await navigator.share({ title: document.title, url: location.href }) } catch {}
    } else {
      copyLink()
    }
  }

  window.submitComment = async (postId) => {
    const nick = $('cNick').value.trim()
    const text = $('cText').value.trim()
    const msg = $('cMsg')
    if (!nick) { msg.textContent = '請填暱稱'; return }
    if (!text) { msg.textContent = '請填留言內容'; return }
    const { error } = await supabase.from('comments').insert({
      post_id: postId, nickname: nick, content: text
    })
    if (error) {
      msg.textContent = '留言失敗：' + error.message
    } else {
      $('cText').value = ''
      msg.textContent = ''
      loadComments(postId)
    }
  }

  async function loadComments(postId) {
    const { data, error } = await supabase
      .from('comments').select('*')
      .eq('post_id', postId)
      .order('created_at', { ascending: true })
    const el = $('commentList')
    if (error) { el.innerHTML = '<div class="no-comment">留言載入失敗</div>'; return }
    if (!data.length) { el.innerHTML = '<div class="no-comment">還沒有人留言，當第一個吧！</div>'; return }
    el.innerHTML = data.map(c => `
      <div class="comment-item">
        <span class="nick">${esc(c.nickname)}</span>
        <span class="time">${new Date(c.created_at).toLocaleString('zh-TW')}</span>
        <div class="text">${esc(c.content)}</div>
        ${isLoggedIn ? `<button class="del-btn" onclick="delComment(${c.id}, ${postId})">刪除</button>` : ''}
      </div>
    `).join('')
  }

  window.delComment = async (commentId, postId) => {
    if (!confirm('刪除這則留言？')) return
    await supabase.from('comments').delete().eq('id', commentId)
    loadComments(postId)
  }

  $('back').onclick = () => showList(true)
  $('logoBtn').onclick = () => showList(true)
  window.addEventListener('popstate', route)

  $('btnLogin').onclick = () => {
    $('listView').classList.add('hidden')
    $('detailView').classList.add('hidden')
    $('editorView').classList.add('hidden')
    $('loginView').classList.remove('hidden')
  }
  $('btnLogout').onclick = async () => {
    await supabase.auth.signOut()
    document.title = '小編日報'
    currentCat = '全部'
    gossipUnlocked = false
    renderCats()
    setUrlId(null)
    refreshAuth()
  }
  $('btnDoLogin').onclick = async () => {
    const email = $('email').value.trim()
    const password = $('password').value
    const { error } = await supabase.auth.signInWithPassword({ email, password })
    if (error) {
      $('loginMsg').textContent = error.message
    } else {
      $('email').value = ''; $('password').value = ''; $('loginMsg').textContent = ''
      refreshAuth()
    }
  }
  $('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnDoLogin').click() })

  $('btnAdd').onclick = async () => {
    const title = $('title').value.trim()
    const content = $('content').value.trim()
    const summary = $('summary').value.trim()
    const category = $('category').value
    const author = $('author').value.trim() || '小編'
    if (!title) { $('editMsg').textContent = '標題不能空白'; return }
    const { error } = await supabase.from('posts').insert({ title, content, summary, category, author })
    if (error) {
      $('editMsg').textContent = '發布失敗：' + error.message
    } else {
      $('title').value = ''; $('content').value = ''; $('summary').value = ''
      $('editMsg').textContent = ''
      loadAdmin()
    }
  }

  window.del = async (id) => {
    if (!confirm('確定刪除？')) return
    await supabase.from('posts').delete().eq('id', id)
    loadAdmin()
  }

  async function loadList() {
    let q = supabase.from('posts').select('*').order('created_at', { ascending: false })

    if (currentCat === '全部') {
      q = q.neq('category', '八卦')
    } else {
      q = q.eq('category', currentCat)
    }

    const { data, error } = await q
    const listView = $('listView')
    if (error) { listView.innerHTML = '<div class="empty">載入失敗：' + esc(error.message) + '</div>'; return }

    const filtered = (data || []).filter(p => {
      if (p.category === '八卦' && !gossipUnlocked && !isLoggedIn) return false
      return true
    })

    if (!filtered.length) { listView.innerHTML = '<div class="empty">這個分類還沒有文章。</div>'; return }
    listView.innerHTML = filtered.map(p => `
      <div class="card" onclick="openPost(${p.id})">
        <span class="cat">${esc(p.category || '未分類')}</span>
        <h2>${esc(p.title)}</h2>
        <div class="meta">${esc(p.author || '小編')} · ${new Date(p.created_at).toLocaleString('zh-TW')}</div>
        <div class="summary">${esc(p.summary || (p.content || '').slice(0, 80) + ((p.content || '').length > 80 ? '...' : ''))}</div>
        <div class="thumb-hint">閱讀全文 →</div>
      </div>
    `).join('')
  }

  async function loadAdmin() {
    const { data } = await supabase.from('posts').select('*').order('created_at', { ascending: false })
    const el = $('adminList')
    if (!data || !data.length) { el.innerHTML = '<div class="empty">還沒有文章。</div>'; return }
    const baseUrl = location.origin + location.pathname
    el.innerHTML = data.map(p => {
      const gossipParam = p.category === '八卦' ? `&gossip=${encodeURIComponent(GOSSIP_PASSWORD)}` : ''
      return `
      <div class="admin-item">
        <div class="info">
          <h3>${esc(p.title)}</h3>
          <div class="meta">${esc(p.category || '')} · ${esc(p.author || '')} · ${new Date(p.created_at).toLocaleString('zh-TW')}</div>
          <a href="${baseUrl}?id=${p.id}${gossipParam}" target="_blank">查看文章 ↗</a>
        </div>
        <button class="btn-del" onclick="del(${p.id})">刪除</button>
      </div>
      `
    }).join('')
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]))
  }

  renderCats()
  refreshAuth()
</script>
</body>
</html>
