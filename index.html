<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MDHS|ADMIN">
<meta name="mobile-web-app-capable" content="yes">
<title>MDHS|ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#0f1a24;color:#e0f0ff;--accent:#1e5a86;--accent-hover:#2872a6;--bubble-user:#1f5a87;--border-accent:#3d8fd9}
body.theme-purple{--accent:#7a4dbf;--accent-hover:#9261d4;--bubble-user:#6a3fb0;--border-accent:#a06be0}
body.theme-green{--accent:#2d8a5c;--accent-hover:#36a06d;--bubble-user:#257a4f;--border-accent:#4ac088}
body.theme-red{--accent:#c0392b;--accent-hover:#d94b3d;--bubble-user:#a5301f;--border-accent:#e05a4a}
body.theme-pink{--accent:#c94b8c;--accent-hover:#d9609d;--bubble-user:#b03d7a;--border-accent:#e075a5}
body.font-small .message .bubble{font-size:.82rem}
body.font-medium .message .bubble{font-size:.92rem}
body.font-large .message .bubble{font-size:1.05rem}
body.font-xlarge .message .bubble{font-size:1.2rem}
body.font-jhenghei{font-family:'Microsoft JhengHei','PingFang TC',sans-serif}
body.font-pingfang{font-family:'PingFang TC','Microsoft JhengHei',sans-serif}
body.font-noto{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}
.app-container{width:100%;height:100vh;height:100dvh;background:#14202e;display:flex;position:relative;overflow:hidden}
.overlay{position:absolute;inset:0;background:linear-gradient(160deg,#0f1a24,#1a2a3a);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px;overflow-y:auto}
.overlay.hidden{display:none}
.card{background:rgba(30,45,60,.95);padding:28px 22px;border-radius:22px;box-shadow:0 15px 30px rgba(0,0,0,.5);width:100%;max-width:420px;border:1px solid rgba(100,180,255,.3)}
.card h2{color:#b8e2ff;font-weight:500;margin-bottom:6px;font-size:1.5rem;text-align:center}
.card p{color:#9ab8d4;margin-bottom:18px;font-size:.85rem;text-align:center}
.card label{display:block;color:#8dc9ff;font-size:.8rem;margin-bottom:6px;margin-top:12px}
.card input,.card select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2d4b66;background:#0f1a24;color:#e0f0ff;font-size:1rem;outline:none}
.card button{width:100%;padding:14px;border-radius:50px;border:none;background:linear-gradient(135deg,#2b6c9e,#1e4b70);color:#fff;font-weight:600;font-size:1rem;cursor:pointer;margin-top:20px}
.card button.secondary{background:transparent;border:1px solid #2f6d9e;color:#8dc9ff;margin-top:10px;padding:12px;font-size:.9rem}
.error-msg{color:#ff7b7b;font-size:.82rem;margin-top:10px;min-height:18px;text-align:center}
.hint-text{font-size:.72rem;color:#587b99;margin-top:12px;text-align:center;line-height:1.5}
.token-display{background:#0a1520;border:1px dashed #4f9eff;padding:10px;border-radius:10px;color:#7bffb0;font-size:.78rem;word-break:break-all;text-align:center;margin-top:10px;font-family:monospace;user-select:all}
.admin-status{padding:10px 12px;border-radius:10px;font-size:.8rem;margin-top:10px;text-align:center}
.admin-status.has-admin{background:rgba(255,200,100,.1);color:#ffd98a;border:1px solid #8a5a1e}
.admin-status.no-admin{background:rgba(123,255,176,.1);color:#7bffb0;border:1px solid #2d7a4d}
.loading-screen{position:fixed;inset:0;background:#0f1a24;display:flex;justify-content:center;align-items:center;z-index:999;color:#8dc9ff;text-align:center;padding:20px}
.loading-screen.hidden{display:none}
.drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.sidebar{position:absolute;top:0;left:0;bottom:0;width:290px;background:#0e1820;border-right:1px solid rgba(70,130,200,.2);display:flex;flex-direction:column;z-index:95;transform:translateX(-100%);transition:transform .25s ease}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:60px 16px 14px;border-bottom:1px solid rgba(70,130,200,.15);color:#b8e2ff;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;position:relative;flex-shrink:0}
.sidebar-close{position:absolute;top:14px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:#b8e2ff;font-size:1.2rem;cursor:pointer}
.room-name{font-size:1rem;color:#e0f0ff;text-transform:none;letter-spacing:0;margin-top:4px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.role-badge{font-size:.62rem;background:var(--accent);padding:2px 8px;border-radius:20px;color:#cce8ff}
.role-badge.admin{background:#8a5a1e;color:#ffe1b0}
.my-rooms-section{border-bottom:1px solid rgba(70,130,200,.15);flex-shrink:0;max-height:40%;display:flex;flex-direction:column}
.my-rooms-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;font-size:.68rem;color:#5f87a8;letter-spacing:1px;text-transform:uppercase}
.my-rooms-header button{background:var(--accent);border:none;color:#cce8ff;font-size:.75rem;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:600}
.my-rooms-list{overflow-y:auto;padding:0 8px 10px}
.my-room-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;color:#b8d4ec;cursor:pointer;font-size:.85rem;margin-bottom:3px;word-break:break-all}
.my-room-item.active{background:var(--accent);color:#fff;font-weight:500}
.my-room-item .info{flex:1;min-width:0}
.my-room-item .rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.my-room-item .rcode{font-size:.7rem;color:#7fa0bd;margin-top:1px}
.my-rooms-empty{padding:16px;text-align:center;color:#587b99;font-size:.78rem}
.channel-list{flex:1;overflow-y:auto;padding:10px}
.channel-section-title{font-size:.68rem;color:#5f87a8;padding:10px 8px 6px;letter-spacing:1px;text-transform:uppercase}
.channel-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;color:#b8d4ec;cursor:pointer;font-size:.92rem;margin-bottom:2px}
.channel-item.active{background:var(--accent);color:#fff;font-weight:500}
.channel-item .del-btn{margin-left:auto;font-size:.75rem;color:#ff9b9b;opacity:.7;padding:4px 8px;border-radius:8px;background:transparent;border:none;cursor:pointer}
.sidebar-footer{padding:12px;border-top:1px solid rgba(70,130,200,.15);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.sidebar-footer button{width:100%;padding:11px;border-radius:12px;border:1px dashed #2f6d9e;background:transparent;color:#8dc9ff;font-size:.85rem;cursor:pointer}
.sidebar-footer button.danger{border-color:#7a2a2a;color:#ff9b9b}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative}
.chat-header{padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;background:#0e1820;border-bottom:1px solid rgba(70,130,200,.2);display:flex;align-items:center;gap:8px;color:#c6e2ff;flex-shrink:0}
.menu-btn{width:38px;height:38px;border-radius:10px;background:rgba(47,109,158,.25);border:none;color:#c6e2ff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-header h3{font-weight:500;font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-header .bot-badge{background:#1e3f5a;border-radius:16px;padding:4px 10px;font-size:.68rem;color:#8dc9ff;border:1px solid #2f6d9e;flex-shrink:0}
.quick-buttons{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:rgba(15,25,35,.5);border-bottom:1px solid rgba(70,130,200,.15)}
.quick-buttons:empty{display:none}
.quick-btn{padding:7px 12px;border-radius:20px;background:var(--accent);color:#e0f0ff;border:1px solid var(--border-accent);font-size:.8rem;cursor:pointer}
.messages-area{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.message{display:flex;flex-direction:column;max-width:85%}
.message.user{align-self:flex-end}
.message.bot{align-self:flex-start}
.message.system{align-self:center;max-width:92%}
.message .bubble{padding:9px 14px;border-radius:18px;font-size:.92rem;line-height:1.45;word-break:break-word}
.message.user .bubble{background:var(--bubble-user);color:#e7f3ff;border-bottom-right-radius:4px}
.message.bot .bubble{background:#142e40;color:#d4e9ff;border:1px solid #2a4b62;border-left:3px solid #3d8fd9;border-bottom-left-radius:4px}
.message.system .bubble{background:rgba(40,60,80,.6);color:#9dbdd8;font-size:.78rem;padding:6px 12px;border-radius:18px}
.message .sender{font-size:.68rem;color:#7f9db8;margin-bottom:3px;padding-left:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.message.user .sender{justify-content:flex-end;padding-right:6px;padding-left:0}
.message .sender .role-tag{color:#ffd98a}
.message .sender .role-tag.member{color:#8dc9ff}
.message .sender .edit-btn{background:transparent;border:none;color:#7fa0bd;font-size:.7rem;padding:0 4px;cursor:pointer;text-decoration:underline}
.message .sender .edited-tag{font-size:.62rem;color:#7fa0bd;margin-left:2px}
.message img.chat-image{max-width:100%;border-radius:12px;margin-top:4px;cursor:pointer;display:block}
.hint{font-size:.68rem;color:#6c8ca5;text-align:center;padding:2px 0 4px}
.input-area{padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:#0e1820;border-top:1px solid rgba(70,130,200,.2);display:flex;gap:6px;flex-shrink:0;align-items:center}
.input-area input[type="text"]{flex:1;padding:12px 16px;border-radius:50px;border:1px solid #244a64;background:#14202e;color:#ecf5ff;font-size:1rem;outline:none;min-width:0}
.input-area button{background:var(--accent);border:none;color:#fff;padding:0 18px;border-radius:50px;font-weight:600;cursor:pointer;font-size:.95rem;flex-shrink:0;height:44px}
.input-area button:disabled{background:#2a3f4f;color:#6d8aa0}
.icon-btn{background:rgba(47,109,158,.35) !important;padding:0 14px !important;font-size:1.2rem !important}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;justify-content:center;align-items:center;z-index:110;padding:16px}
.modal-backdrop.hidden{display:none}
.modal{background:#162635;padding:22px;border-radius:20px;width:100%;max-width:440px;border:1px solid #2f6d9e;max-height:85vh;overflow-y:auto}
.modal h3{color:#b8e2ff;font-weight:500;margin-bottom:14px;font-size:1.15rem}
.modal label{display:block;color:#8dc9ff;font-size:.78rem;margin-bottom:6px;margin-top:12px}
.modal input,.modal select,.modal textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2d4b66;background:#0f1a24;color:#e0f0ff;font-size:1rem;outline:none;font-family:inherit}
.modal textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;padding:12px;border-radius:40px;border:none;font-weight:600;cursor:pointer;font-size:.9rem}
.modal-actions .confirm{background:var(--accent);color:#fff}
.modal-actions .cancel{background:transparent;border:1px solid #3d5f7a;color:#9dbdd8}
.empty-state{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#5f87a8;gap:10px;font-size:.9rem;padding:40px 20px;text-align:center}
.empty-state .big{font-size:2.5rem;opacity:.5}
.member-item,.cmd-item,.btn-item{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(15,25,35,.6);border-radius:10px;font-size:.85rem;margin-bottom:6px}
.member-item .name{flex:1;color:#d4e9ff}
.member-item .badge{font-size:.62rem;padding:2px 6px;border-radius:8px;background:var(--accent);color:#cce8ff}
.member-item .badge.admin{background:#8a5a1e;color:#ffe1b0}
.member-item .kick-btn{font-size:.7rem;padding:5px 10px;background:#7a2a2a;color:#ffc5c5;border:none;border-radius:8px;cursor:pointer}
.member-item.self{background:rgba(31,90,135,.4)}
.cmd-item .cmd-name{color:#7bffb0;font-family:monospace;min-width:70px}
.cmd-item .cmd-resp{flex:1;color:#d4e9ff;font-size:.8rem;word-break:break-all}
.cmd-item .del-btn,.btn-item .del-btn{font-size:.7rem;padding:5px 10px;background:#7a2a2a;color:#ffc5c5;border:none;border-radius:8px;cursor:pointer}
.btn-item .btn-label{flex:1;color:#d4e9ff}
.btn-item .btn-type{font-size:.62rem;padding:2px 6px;border-radius:8px;background:var(--accent);color:#cce8ff}
.room-code-box{padding:16px;background:#0a1520;border:1px dashed var(--border-accent);border-radius:12px;color:#7bffb0;font-size:1.5rem;font-family:monospace;text-align:center;letter-spacing:3px;user-select:all;margin-top:4px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 80px);left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 22px;border-radius:30px;font-size:.9rem;z-index:800;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.uploading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center;z-index:300;color:#b8e2ff}
.uploading-overlay.hidden{display:none}
.toolbox-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#0f1a24,#1a2a3a);z-index:500;display:none;flex-direction:column}
.toolbox-overlay.open{display:flex}
.toolbox-header{padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;background:#0e1820;border-bottom:1px solid rgba(70,130,200,.2);display:flex;align-items:center;gap:12px;flex-shrink:0}
.toolbox-header h2{flex:1;color:#b8e2ff;font-weight:500;font-size:1.15rem}
.toolbox-close{width:38px;height:38px;border-radius:10px;background:rgba(47,109,158,.25);border:none;color:#c6e2ff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toolbox-tabs{display:flex;gap:6px;padding:10px 12px;background:rgba(15,25,35,.5);overflow-x:auto;flex-shrink:0;border-bottom:1px solid rgba(70,130,200,.15)}
.toolbox-tab{padding:8px 14px;border-radius:20px;background:rgba(47,109,158,.2);color:#b8d4ec;border:1px solid transparent;font-size:.85rem;cursor:pointer;white-space:nowrap}
.toolbox-tab.active{background:var(--accent);color:#fff;border-color:var(--border-accent)}
.toolbox-content{flex:1;overflow-y:auto;padding:16px}
.toolbox-panel{display:none}
.toolbox-panel.active{display:block}
.timer-display{font-size:3rem;font-family:monospace;text-align:center;color:#e0f0ff;padding:20px;letter-spacing:2px}
.timer-switch{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.timer-switch button{padding:8px 16px;border-radius:20px;border:1px solid #2d4b66;background:transparent;color:#8dc9ff;cursor:pointer;font-size:.9rem}
.timer-switch button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.timer-input-row{display:flex;gap:8px;margin-bottom:12px}
.timer-input-row input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid #2d4b66;background:#0f1a24;color:#e0f0ff;font-size:1rem;outline:none}
.timer-actions{display:flex;gap:8px}
.timer-actions button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:600;cursor:pointer;font-size:.9rem}
.timer-actions .primary{background:var(--accent);color:#fff}
.timer-actions .secondary{background:rgba(47,109,158,.3);color:#cce8ff;border:1px solid #2f6d9e}
.timer-actions .danger{background:#7a2a2a;color:#ffc5c5}
.notes-area{width:100%;min-height:60vh;padding:14px;border-radius:12px;border:1px solid #2d4b66;background:#0f1a24;color:#e0f0ff;font-size:1rem;font-family:inherit;outline:none;resize:vertical;line-height:1.5}
.notes-info{font-size:.75rem;color:#587b99;text-align:right;margin-top:6px}
.calc-display{padding:16px;background:#0a1520;border-radius:12px;text-align:right;font-size:2rem;font-family:monospace;color:#e0f0ff;margin-bottom:12px;word-break:break-all;min-height:70px;display:flex;align-items:center;justify-content:flex-end}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{padding:18px 0;border-radius:14px;border:none;background:rgba(47,109,158,.3);color:#e0f0ff;font-size:1.2rem;cursor:pointer;font-weight:500}
.calc-grid .op{background:rgba(138,90,30,.5);color:#ffe1b0}
.calc-grid .eq{background:var(--accent);color:#fff}
.calc-grid .clear{background:rgba(122,42,42,.5);color:#ffc5c5}
.countdown-input{display:flex;gap:8px;margin-bottom:14px}
.countdown-input input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid #2d4b66;background:#0f1a24;color:#e0f0ff;font-size:1rem;outline:none}
.countdown-result{text-align:center;padding:24px;background:rgba(15,25,35,.7);border-radius:16px;margin-bottom:12px}
.countdown-result .days{font-size:3rem;font-weight:600;color:#7bffb0;font-family:monospace}
.countdown-result .label{color:#9ab8d4;font-size:.9rem;margin-top:6px}
.countdown-result .target-date{color:#587b99;font-size:.8rem;margin-top:8px}
.theme-picker{display:flex;gap:10px;margin-top:8px;justify-content:space-between}
.theme-swatch{width:44px;height:44px;border-radius:12px;cursor:pointer;border:3px solid transparent;flex-shrink:0}
.theme-swatch.active{border-color:#fff;box-shadow:0 0 0 2px #4f9eff}
.option-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.option-btn{flex:1;min-width:60px;padding:10px 8px;border-radius:10px;border:1px solid #2d4b66;background:transparent;color:#8dc9ff;font-size:.85rem;cursor:pointer}
.option-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(min-width:768px){.drawer-backdrop{display:none}.sidebar{position:relative;transform:none;width:290px;flex-shrink:0}.sidebar-close{display:none}.sidebar-header{padding:18px}.menu-btn{display:none}.chat-header{padding:16px 22px}.messages-area{padding:20px 18px 10px}.input-area{padding:14px 20px 18px}.toast{bottom:30px}.app-container{max-width:1250px;margin:auto}}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">載入中...</div>
<div class="app-container">
<div class="overlay hidden" id="joinOverlay">
<div class="card">
<h2 id="joinTitle">🔒 加入聊天室</h2>
<p id="joinSubtitle">輸入聊天室代碼以繼續</p>
<div id="joinFields">
<label>聊天室代碼</label>
<input type="text" id="roomCodeInput" placeholder="例如: 123456" autocomplete="off">
<label>你的暱稱</label>
<input type="text" id="nicknameInput" placeholder="輸入暱稱（不能用「管理員」）" autocomplete="off">
<div id="adminStatusBox"></div>
<div id="tokenFieldWrap">
<label>管理員 Token（選填）</label>
<input type="text" id="tokenInput" placeholder="若你是管理員，請輸入 Token" autocomplete="off">
</div>
</div>
<div id="createFields" style="display:none">
<label>聊天室名稱</label>
<input type="text" id="newRoomName" placeholder="例如: 我的討論區">
<label>聊天室代碼</label>
<input type="text" id="newRoomCode" placeholder="設定一組代碼">
<label>你的暱稱</label>
<input type="text" id="newRoomNickname" placeholder="輸入暱稱" autocomplete="off">
<p class="hint-text">建立後系統會給您一組管理員 Token，請務必保存！</p>
</div>
<button id="joinBtn">加入聊天</button>
<button class="secondary" id="switchToCreateBtn">＋ 建立新的聊天室</button>
<div class="error-msg" id="errorMsg"></div>
<div id="tokenDisplay"></div>
</div>
</div>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="sidebar" id="sidebar">
<div class="sidebar-header">
<button class="sidebar-close" id="closeSidebarBtn">✕</button>
目前聊天室
<div class="room-name"><span id="currentRoomName">未加入</span><span class="role-badge" id="roleBadge">成員</span></div>
</div>
<div class="my-rooms-section">
<div class="my-rooms-header"><span>我的聊天室</span><button id="addRoomBtn">＋ 加入 / 新增</button></div>

function formatTime(ms){if(ms<0)ms=0;const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function renderTimer(){timerDisplay.textContent=timerMode==='countdown'?formatTime(timerRemaining):formatTime(stopwatchElapsed);}

async function cleanupExpiredRooms(){const d=new Date(Date.now()-7*86400000).toISOString();const{data}=await sb.from('rooms').select('id').lt('last_active',d);if(!data)return;for(const r of data)await sb.from('rooms').delete().eq('id',r.id);}
async function touchRoom(){if(!currentRoom)return;await sb.from('rooms').update({last_active:new Date().toISOString()}).eq('id',currentRoom.id);}

async function loadChannels(id){const{data}=await sb.from('channels').select('*').eq('room_id',id).order('created_at');channels=data||[];renderChannelList();}
async function loadMessages(id){const{data}=await sb.from('messages').select('*').eq('channel_id',id).order('created_at');messages=data||[];renderMessages();}
async function loadMembers(id){const{data}=await sb.from('members').select('*').eq('room_id',id).order('created_at');members=data||[];renderMembers();}
async function loadCmds(id){const{data}=await sb.from('custom_commands').select('*').eq('room_id',id).order('created_at');customCmds=data||[];renderCmds();}
async function loadBtns(id){const{data}=await sb.from('custom_buttons').select('*').eq('room_id',id).order('created_at');customBtns=data||[];renderQuickButtons();renderBtns();}
async function findRoomByCode(code){const{data}=await sb.from('rooms').select('*').eq('code',code.toLowerCase()).maybeSingle();return data;}

function renderMyRooms(){const rooms=getMyRooms();if(!rooms.length){myRoomsListEl.innerHTML='<div class="my-rooms-empty">還沒有加入任何聊天室</div>';return;}let h='';rooms.forEach(r=>{h+='<div class="my-room-item '+(currentRoom&&currentRoom.id===r.id?'active':'')+'" data-room-id="'+r.id+'"><span>🔒</span><div class="info"><div class="rname">'+escapeHtml(r.name)+'</div><div class="rcode">#'+escapeHtml(r.code)+'</div></div></div>';});myRoomsListEl.innerHTML=h;myRoomsListEl.querySelectorAll('.my-room-item').forEach(e=>e.addEventListener('click',()=>switchToRoom(e.dataset.roomId)));}
async function switchToRoom(id){if(currentRoom&&currentRoom.id===id){closeDrawer();return;}const t=getMyRooms().find(r=>r.id===id);if(!t)return;closeDrawer();await joinRoomByCode(t.code,currentUser.nickname,true);}

function renderChannelList(){if(!channels.length){channelListEl.innerHTML='';return;}let h='';const n=channels.filter(c=>c.type!=='forum'),f=channels.filter(c=>c.type==='forum');if(n.length){h+='<div class="channel-section-title">頻道</div>';n.forEach(c=>h+=channelItemHtml(c));}if(f.length){h+='<div class="channel-section-title">討論區</div>';f.forEach(c=>h+=channelItemHtml(c));}channelListEl.innerHTML=h;channelListEl.querySelectorAll('.channel-item').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.classList.contains('del-btn'))return;switchChannel(e.dataset.channelId);closeDrawer();}));channelListEl.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',async ev=>{ev.stopPropagation();const ch=channels.find(c=>c.id===b.dataset.channelId);if(!ch)return;if(!isAdmin()){alert('只有管理員');return;}if(ch.name==='加入'){alert('無法刪除');return;}if(!confirm('確定刪除？'))return;await sb.from('channels').delete().eq('id',b.dataset.channelId);await loadChannels(currentRoom.id);if(!channels.find(c=>c.id===currentChannel?.id)){if(channels.length)switchChannel(channels[0].id);else{currentChannel=null;renderMessages();}}}));}
function channelItemHtml(ch){const canDel=isAdmin()&&ch.name!=='加入';return'<div class="channel-item '+(ch.id===currentChannel?.id?'active':'')+'" data-channel-id="'+ch.id+'"><span>'+channelIcon(ch.type)+'</span><span>'+escapeHtml(ch.name)+'</span>'+(canDel?'<button class="del-btn" data-channel-id="'+ch.id+'">✕</button>':'')+'</div>';}
function getRoleOfSender(n){const m=members.find(x=>x.nickname===n);return m?m.role:'member';}

function renderMessages(){
  if(!currentChannel){messagesArea.innerHTML='<div class="empty-state"><div class="big">💬</div><div>請選擇一個頻道</div></div>';return;}
  if(!messages.length){messagesArea.innerHTML='<div class="empty-state"><div class="big">✨</div><div>這個頻道還沒有訊息</div></div>';return;}
  let h='';
  messages.forEach(m=>{
    if(m.is_system){h+='<div class="message system"><div class="bubble">'+escapeHtml(m.text)+'</div></div>';}
    else{
      const cls=m.is_bot?'bot':'user',isMine=!m.is_bot&&m.sender===currentUser.nickname,isImg=m.text&&m.text.startsWith(IMG_PREFIX);
      let lbl='';
      if(m.is_bot)lbl='🤖 小幫手';
      else{const r=getRoleOfSender(m.sender);lbl=escapeHtml(m.sender)+' '+(r==='admin'?'<span class="role-tag">[管理員]</span>':'<span class="role-tag member">[成員]</span>');}
      const eTag=m.edited?'<span class="edited-tag">（已編輯）</span>':'';
      const eBtn=(isMine&&!isImg)?'<button class="edit-btn" data-msg-id="'+m.id+'">✏️ 編輯</button>':'';
      let ch='';
      if(isImg){const u=m.text.substring(IMG_PREFIX.length);ch='<img class="chat-image" src="'+escapeHtml(u)+'" onclick="window.open(\''+escapeHtml(u)+'\',\'_blank\')">';}
      else ch=escapeHtml(m.text).replace(/\n/g,'<br>');
      h+='<div class="message '+cls+'" data-msg-id="'+m.id+'"><div class="sender">'+lbl+eTag+eBtn+'</div><div class="bubble">'+ch+'</div></div>';
    }
  });
  messagesArea.innerHTML=h;
  messagesArea.scrollTop=messagesArea.scrollHeight;
  messagesArea.querySelectorAll('.edit-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openEditMsgModal(b.dataset.msgId);}));
}

function renderMembers(){if(!members.length){memberList.innerHTML='<div style="color:#7f9db8;text-align:center;padding:20px">目前沒有成員</div>';return;}let h='';members.forEach(m=>{const isSelf=m.user_id===USER_ID,isA=m.role==='admin';const kb=(isAdmin()&&!isSelf&&!isA)?'<button class="kick-btn" data-user-id="'+m.user_id+'">踢出</button>':'';h+='<div class="member-item '+(isSelf?'self':'')+'"><span class="name">'+escapeHtml(m.nickname)+(isSelf?' <span style="color:#7bffb0;font-size:.7rem">(你)</span>':'')+'</span><span class="badge '+(isA?'admin':'')+'">'+(isA?'管理員':'成員')+'</span>'+kb+'</div>';});memberList.innerHTML=h;memberList.querySelectorAll('.kick-btn').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('確定踢出？'))return;await sb.from('members').delete().eq('room_id',currentRoom.id).eq('user_id',b.dataset.userId);await sendSystemMessage('一位成員被管理員踢出聊天室');await loadMembers(currentRoom.id);showToast('已踢出');}));}

function renderCmds(){if(!customCmds.length){cmdList.innerHTML='<div style="color:#7f9db8;text-align:center;padding:20px">尚未設定任何指令</div>';return;}let h='';customCmds.forEach(c=>{h+='<div class="cmd-item"><span class="cmd-name">'+escapeHtml(c.command)+'</span><span class="cmd-resp">'+escapeHtml(c.response)+'</span><button class="del-btn" data-cmd-id="'+c.id+'">✕</button></div>';});cmdList.innerHTML=h;cmdList.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',async()=>{if(!isAdmin()){alert('只有管理員');return;}if(!confirm('刪除？'))return;await sb.from('custom_commands').delete().eq('id',b.dataset.cmdId);await loadCmds(currentRoom.id);}));}

function renderBtns(){if(!btnList)return;if(!customBtns.length){btnList.innerHTML='<div style="color:#7f9db8;text-align:center;padding:20px">尚未設定任何按鈕</div>';return;}let h='';customBtns.forEach(b=>{h+='<div class="btn-item"><span class="btn-label">'+escapeHtml(b.label)+'</span><span class="btn-type">'+(b.action_type==='link'?'🔗 連結':'📋 複製')+'</span><button class="del-btn" data-btn-id="'+b.id+'">✕</button></div>';});btnList.innerHTML=h;btnList.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',async()=>{if(!isAdmin()){alert('只有管理員');return;}if(!confirm('刪除？'))return;await sb.from('custom_buttons').delete().eq('id',b.dataset.btnId);await loadBtns(currentRoom.id);}));}
function renderQuickButtons(){if(!customBtns.length){quickButtons.innerHTML='';return;}let h='';customBtns.forEach(b=>{h+='<button class="quick-btn" data-btn-id="'+b.id+'">'+escapeHtml(b.label)+'</button>';});quickButtons.innerHTML=h;quickButtons.querySelectorAll('.quick-btn').forEach(b=>b.addEventListener('click',()=>{const x=customBtns.find(y=>y.id===b.dataset.btnId);if(!x)return;if(x.action_type==='link')window.open(x.action_value,'_blank');else if(x.action_type==='copy'){navigator.clipboard.writeText(x.action_value).then(()=>showToast('✅ 已複製')).catch(()=>{const ta=document.createElement('textarea');ta.value=x.action_value;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ 已複製');});}}));}

function switchChannel(id){currentChannel=channels.find(c=>c.id===id);if(!currentChannel)return;channelTitle.textContent=channelIcon(currentChannel.type)+' '+currentChannel.name;renderChannelList();loadMessages(id);messageInput.focus();}
function updateRoomUI(){if(!currentRoom)return;currentRoomNameEl.textContent=currentRoom.name;roleBadge.textContent=isAdmin()?'管理員':'成員';roleBadge.className='role-badge'+(isAdmin()?' admin':'');leaveRoomBtn.style.display='block';}

async function joinRoomByCode(code,nickname,skipV){
  if(isJoining)return;isJoining=true;
  try{
    code=(code||'').trim().toLowerCase();
    if(!code){errorMsg.textContent='請輸入代碼';return;}
    if(!skipV){const v=validateNickname(nickname);if(!v.ok){errorMsg.textContent=v.msg;return;}nickname=v.name;}
    errorMsg.textContent='載入中...';
    await cleanupExpiredRooms();
    const room=await findRoomByCode(code);
    if(!room){errorMsg.textContent='找不到此聊天室';return;}
    const tok=tokenInput.value.trim(),saved=getMyTokens()[room.id];
    const hasTok=(tok&&tok===room.admin_token)||(saved&&saved===room.admin_token);
    const{data:mine}=await sb.from('members').select('*').eq('room_id',room.id).eq('user_id',USER_ID).maybeSingle();
    let role='member';
    if(mine&&!hasTok)role=mine.role;
    else if(hasTok){const oa=await findOtherAdminIncludingSelf(room.id);if(oa&&oa.user_id!==USER_ID)await sb.from('members').delete().eq('room_id',room.id).eq('user_id',oa.user_id);role='admin';if(tok)saveToken(room.id,tok);showToast('✅ 已恢復管理員');}
    else{role='member';if(tok&&tok!==room.admin_token){errorMsg.textContent='Token 錯誤';await new Promise(r=>setTimeout(r,800));}}
    currentRoom=room;currentUser={nickname:nickname,role:role};
    localStorage.setItem('chat_last_room_code',code);localStorage.setItem('chat_last_nickname',nickname);addMyRoom(room);
    joinOverlay.classList.add('hidden');updateRoomUI();renderMyRooms();
    await touchRoom();await loadChannels(room.id);await loadMembers(room.id);await loadCmds(room.id);await loadBtns(room.id);
    await sb.from('members').upsert({room_id:room.id,user_id:USER_ID,nickname:nickname,role:role,last_seen:new Date().toISOString()},{onConflict:'room_id,user_id'});
    if(channels.length){switchChannel(channels[0].id);await sendSystemMessage(nickname+' 加入了聊天室');}
    else{const{data}=await sb.from('channels').insert({room_id:room.id,name:'一般',type:'text'}).select().single();if(data){await loadChannels(room.id);switchChannel(data.id);}}
    messageInput.disabled=false;sendBtn.disabled=false;uploadImageBtn.disabled=false;messageInput.placeholder='輸入訊息...';
    subscribeRealtime();startHeartbeat();
  }catch(e){console.error(e);errorMsg.textContent='載入失敗：'+(e.message||'');}
  finally{isJoining=false;}
}

async function tryCreateRoom(){
  const name=newRoomName.value.trim(),code=newRoomCode.value.trim().toLowerCase(),nick=newRoomNickname.value.trim();
  if(!name||!code){errorMsg.textContent='請填寫名稱與代碼';return;}
  const v=validateNickname(nick);if(!v.ok){errorMsg.textContent=v.msg;return;}
  errorMsg.textContent='建立中...';
  await cleanupExpiredRooms();
  const ex=await findRoomByCode(code);
  if(ex){errorMsg.textContent='此代碼已被使用';return;}
  const aTok='adm_'+Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,8);
  const{data:room,error}=await sb.from('rooms').insert({name:name,code:code,admin_token:aTok}).select().single();
  if(error||!room){errorMsg.textContent='建立失敗：'+(error?.message||'');return;}
  await sb.from('channels').insert([{room_id:room.id,name:'加入',type:'announcement'},{room_id:room.id,name:'一般',type:'text'},{room_id:room.id,name:'討論區',type:'forum'}]);
  currentRoom=room;currentUser={nickname:v.name,role:'admin'};
  saveToken(room.id,aTok);localStorage.setItem('chat_last_room_code',code);localStorage.setItem('chat_last_nickname',v.name);addMyRoom(room);
  joinOverlay.classList.add('hidden');updateRoomUI();renderMyRooms();
  await loadChannels(room.id);await loadMembers(room.id);await loadCmds(room.id);await loadBtns(room.id);
  await sb.from('members').upsert({room_id:room.id,user_id:USER_ID,nickname:v.name,role:'admin',last_seen:new Date().toISOString()},{onConflict:'room_id,user_id'});
  switchChannel(channels[0].id);
  await sendSystemMessage('聊天室「'+name+'」已建立！'+v.name+' 是管理員。');
  tokenDisplay.innerHTML='<div class="token-display">🔑 Token（請保存）：<br>'+aTok+'</div>';
  alert('🎉 聊天室已建立！\n\n管理員 Token：\n'+aTok+'\n\n請保存好！');
  messageInput.disabled=false;sendBtn.disabled=false;uploadImageBtn.disabled=false;messageInput.placeholder='輸入訊息...';
  subscribeRealtime();startHeartbeat();
}

function setCreateMode(c){isCreateMode=c;joinTitle.textContent=c?'✨ 建立聊天室':'🔒 加入聊天室';joinSubtitle.textContent=c?'建立一個屬於你的聊天室':'輸入聊天室代碼以繼續';joinFields.style.display=c?'none':'block';createFields.style.display=c?'block':'none';joinBtn.textContent=c?'建立並加入':'加入聊天';switchToCreateBtn.textContent=c?'← 返回':'＋ 建立新的聊天室';errorMsg.textContent='';tokenDisplay.innerHTML='';adminStatusBox.innerHTML='';tokenFieldWrap.style.display='none';}

let checkTimer=null;
roomCodeInput.addEventListener('input',()=>{if(checkTimer)clearTimeout(checkTimer);checkTimer=setTimeout(async()=>{const code=roomCodeInput.value.trim().toLowerCase();if(!code||isCreateMode){adminStatusBox.innerHTML='';tokenFieldWrap.style.display='block';return;}const room=await findRoomByCode(code);if(!room){adminStatusBox.innerHTML='';tokenFieldWrap.style.display='block';return;}const oa=await checkRoomHasAdmin(room.id);const{data:mine}=await sb.from('members').select('role').eq('room_id',room.id).eq('user_id',USER_ID).maybeSingle();if(oa)adminStatusBox.innerHTML='<div class="admin-status has-admin">⚠️ 已有管理員：'+escapeHtml(oa.nickname)+'<br><span style="font-size:.7rem;opacity:.8">若你是原本的管理員，可輸入 Token</span></div>';else if(mine&&mine.role==='admin')adminStatusBox.innerHTML='<div class="admin-status no-admin">✅ 你是管理員</div>';else adminStatusBox.innerHTML='<div class="admin-status no-admin">✅ 沒有管理員<br><span style="font-size:.7rem;opacity:.8">若有 Token，可輸入成為管理員</span></div>';tokenFieldWrap.style.display='block';},500);});

function subscribeRealtime(){
  if(rtMessages)sb.removeChannel(rtMessages);if(rtMembers)sb.removeChannel(rtMembers);if(rtCmds)sb.removeChannel(rtCmds);if(rtBtns)sb.removeChannel(rtBtns);
  rtMessages=sb.channel('rt-messages-'+currentRoom.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(currentChannel&&m.channel_id===currentChannel.id){messages.push(m);renderMessages();}})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{const m=p.new;if(currentChannel&&m.channel_id===currentChannel.id){const i=messages.findIndex(x=>x.id===m.id);if(i>=0){messages[i]=m;renderMessages();}}})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'channels'},async()=>{if(currentRoom){await loadChannels(currentRoom.id);if(!channels.length){currentChannel=null;renderMessages();}else if(!channels.find(c=>c.id===currentChannel?.id))switchChannel(channels[0].id);}})
    .subscribe();
  rtMembers=sb.channel('rt-members-'+currentRoom.id).on('postgres_changes',{event:'*',schema:'public',table:'members'},async p=>{if(p.eventType==='DELETE'&&p.old&&p.old.user_id===USER_ID){alert('您已被踢出此聊天室');removeMyRoom(currentRoom.id);localStorage.removeItem('chat_last_room_code');localStorage.removeItem('chat_last_nickname');location.reload();return;}if(currentRoom)await loadMembers(currentRoom.id);}).subscribe();
  rtCmds=sb.channel('rt-cmds-'+currentRoom.id).on('postgres_changes',{event:'*',schema:'public',table:'custom_commands'},async()=>{if(currentRoom)await loadCmds(currentRoom.id);}).subscribe();
  rtBtns=sb.channel('rt-btns-'+currentRoom.id).on('postgres_changes',{event:'*',schema:'public',table:'custom_buttons'},async()=>{if(currentRoom)await loadBtns(currentRoom.id);}).subscribe();
}

function startHeartbeat(){if(heartbeatTimer)clearInterval(heartbeatTimer);heartbeatTimer=setInterval(async()=>{if(!currentRoom||!currentUser.nickname)return;await sb.from('members').update({last_seen:new Date().toISOString()}).eq('room_id',currentRoom.id).eq('user_id',USER_ID);await touchRoom();},30000);}

uploadImageBtn.addEventListener('click',()=>{if(!currentChannel){showToast('請先選擇頻道');return;}imageFileInput.click();});
imageFileInput.addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!currentChannel)return;if(f.size>5242880){showToast('圖片不能超過 5MB');imageFileInput.value='';return;}uploadingOverlay.classList.remove('hidden');try{const ext=f.name.split('.').pop()||'jpg',fn=USER_ID+'_'+Date.now()+'.'+ext;const{error}=await sb.storage.from('chat-images').upload(fn,f,{cacheControl:'3600',upsert:false});if(error)throw error;const{data:ud}=sb.storage.from('chat-images').getPublicUrl(fn);await sb.from('messages').insert({channel_id:currentChannel.id,text:IMG_PREFIX+ud.publicUrl,sender:currentUser.nickname,is_bot:false,is_system:false});await touchRoom();showToast('✅ 圖片已傳送');}catch(e){showToast('❌ 上傳失敗：'+(e.message||''));}finally{uploadingOverlay.classList.add('hidden');imageFileInput.value='';}});

function handleBotCommand(cmd,full){
  const c=cmd.trim().toLowerCase();
  const cu=customCmds.find(x=>x.command.toLowerCase()===c);
  if(cu)return cu.response;
  if(c==='/規則'||c==='/rule')return'📋 規則：\n1. 尊重\n2. 禁廣告\n3. 友善\n4. /help 查看';
  if(c==='/help'||c==='/幫助'){let h='🤖 指令：\n/規則\n/help\n/時間\n/問候\n/頻道';if(isAdmin())h+='\n\n👑 管理員：\n/set /名稱 回應\n/del /名稱';if(customCmds.length)h+='\n\n📝 自訂：\n'+customCmds.map(x=>x.command).join(', ');return h;}
  if(c==='/時間'||c==='/time')return'🕒 '+new Date().toLocaleTimeString('zh-TW',{hour12:false});
  if(c==='/問候'||c==='/hello')return'你好 '+escapeHtml(currentUser.nickname)+'！';
  if(c==='/頻道'||c==='/channels')return'📁 頻道：\n'+channels.map(ch=>channelIcon(ch.type)+' '+ch.name).join('\n');
  if(c.startsWith('/'))return'❓ 未知指令「'+full+'」，輸入 /help 查看。';
  return null;
}

async function sendUserMessage(){
  const t=messageInput.value.trim();if(!t||!currentChannel)return;
  if(isAdmin()&&t.startsWith('/set ')){const r=t.substring(5).trim(),i=r.indexOf(' ');if(i===-1){showToast('格式：/set /名稱 回應');return;}let n=r.substring(0,i).trim(),v=r.substring(i+1).trim();if(!n.startsWith('/'))n='/'+n;await sb.from('custom_commands').upsert({room_id:currentRoom.id,command:n,response:v},{onConflict:'room_id,command'});await loadCmds(currentRoom.id);messageInput.value='';showToast('✅ 已設定 '+n);return;}
  if(isAdmin()&&t.startsWith('/del ')){let n=t.substring(5).trim();if(!n.startsWith('/'))n='/'+n;await sb.from('custom_commands').delete().eq('room_id',currentRoom.id).eq('command',n);await loadCmds(currentRoom.id);messageInput.value='';showToast('✅ 已刪除 '+n);return;}
  await sb.from('messages').insert({channel_id:currentChannel.id,text:escapeHtml(t),sender:currentUser.nickname,is_bot:false,is_system:false});
  await touchRoom();messageInput.value='';
  if(t.startsWith('/')){const r=handleBotCommand(t,t);if(r)setTimeout(async()=>{await sb.from('messages').insert({channel_id:currentChannel.id,text:escapeHtml(r),sender:'小幫手',is_bot:true,is_system:false});},200);}
}

joinBtn.addEventListener('click',()=>{if(isCreateMode)tryCreateRoom();else joinRoomByCode(roomCodeInput.value,nicknameInput.value);});
switchToCreateBtn.addEventListener('click',()=>setCreateMode(!isCreateMode));
[roomCodeInput,nicknameInput,tokenInput,newRoomName,newRoomCode,newRoomNickname].forEach(i=>{if(i)i.addEventListener('keypress',e=>{if(e.key==='Enter'){e.preventDefault();joinBtn.click();}});});
sendBtn.addEventListener('click',sendUserMessage);
messageInput.addEventListener('keypress',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendUserMessage();}});
addChannelBtn.addEventListener('click',openChannelModal);
cancelChannelBtn.addEventListener('click',closeChannelModal);
confirmChannelBtn.addEventListener('click',confirmAddChannel);
viewMembersBtn.addEventListener('click',openMembersModal);
closeMembersBtn.addEventListener('click',closeMembersModal);
manageCmdsBtn.addEventListener('click',openCmdsModal);
closeCmdsBtn.addEventListener('click',closeCmdsModal);
addCmdBtn.addEventListener('click',addCmd);
manageBtnsBtn.addEventListener('click',openBtnsModal);
closeBtnsBtn.addEventListener('click',closeBtnsModal);
addBtnBtn.addEventListener('click',addBtn);
addRoomBtn.addEventListener('click',()=>{closeDrawer();joinOverlay.classList.remove('hidden');setCreateMode(false);roomCodeInput.value='';roomCodeInput.focus();});

function init(){
  renderMyRooms();
  loadingScreen.classList.add('hidden');
  joinOverlay.classList.remove('hidden');
  roomCodeInput.focus();
}
init();
})();
</script>
