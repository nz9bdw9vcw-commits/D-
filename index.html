<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓陳的女生長得漂亮？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #fbe9f0 0%, #f8d9e6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(180, 100, 130, 0.25), 
                        0 8px 20px rgba(150, 70, 100, 0.15),
                        inset 0 1px 4px rgba(255, 255, 255, 0.8);
            padding: 3rem 2.5rem;
            max-width: 700px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 235, 245, 0.8);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #a13e5c;
            letter-spacing: 0.02em;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 0 #ffeef4, 4px 4px 0 rgba(210, 140, 170, 0.2);
            word-break: break-word;
        }

        .highlight {
            display: inline-block;
            background: #fce4ec;
            padding: 0.1em 0.4em;
            border-radius: 20px;
            color: #a1304e;
            box-shadow: inset 0 -2px 0 #f8bbd0;
        }

        .sub-message {
            font-size: 1.5rem;
            color: #6b3e4f;
            margin-bottom: 2.5rem;
            font-weight: 400;
            background: rgba(255, 245, 250, 0.7);
            padding: 1rem 1.2rem;
            border-radius: 80px;
            display: inline-block;
            border: 1px dashed #e6b0c2;
            backdrop-filter: blur(4px);
        }

        .cta-area {
            margin-top: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            background: #ffffffd9;
            padding: 1rem 2.2rem;
            border-radius: 60px;
            font-size: 1.25rem;
            font-weight: 600;
            font-family: inherit;
            color: #a13e5c;
            box-shadow: 0 6px 0 #cc9aa9, 0 10px 18px rgba(170, 100, 120, 0.2);
            cursor: pointer;
            transition: all 0.1s ease;
            border: 1px solid #ffdae6;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #cc9aa9, 0 5px 12px rgba(170, 100, 120, 0.25);
        }

        .btn-primary {
            background: #d86f8f;
            color: white;
            box-shadow: 0 6px 0 #9e4460, 0 10px 20px rgba(200, 100, 130, 0.4);
            border: 1px solid #f7b8ce;
        }

        .btn-primary:active {
            box-shadow: 0 2px 0 #9e4460, 0 5px 12px rgba(200, 100, 130, 0.4);
        }

        .dynamic-area {
            margin-top: 2.5rem;
            min-height: 4.5rem;
            font-size: 1.4rem;
            color: #7d4b60;
            background: rgba(255, 240, 246, 0.9);
            padding: 1.2rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #f3cad8;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 0 12px #ffe3ee;
            word-break: break-word;
        }

        .dynamic-area span {
            animation: fadePop 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadePop {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .emoji-lg {
            font-size: 2rem;
            margin-right: 8px;
            filter: drop-shadow(0 4px 6px rgba(180, 120, 140, 0.3));
        }

        /* 響應式 */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 32px;
            }
            h1 {
                font-size: 2.1rem;
            }
            .sub-message {
                font-size: 1.2rem;
                padding: 0.8rem 1rem;
            }
            .btn {
                padding: 0.9rem 1.5rem;
                font-size: 1.1rem;
            }
            .dynamic-area {
                font-size: 1.1rem;
                padding: 1rem 1rem;
                min-height: 4rem;
            }
        }

        @media (max-width: 380px) {
            h1 {
                font-size: 1.7rem;
            }
            .btn-group {
                flex-direction: column;
                gap: 0.9rem;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            <span class="highlight">姓陳</span>的女生<br>長得漂亮？
        </h1>
        <div class="sub-message">
            ✨ 這還用問嗎 ✨
        </div>

        <div class="cta-area">
            <div class="btn-group">
                <button class="btn btn-primary" id="yesBtn">當然漂亮！ 💖</button>
                <button class="btn" id="smileBtn">讓我看看 😊</button>
            </div>
        </div>

        <div class="dynamic-area" id="messageBox">
            <span>👩🏻‍🦰 你心裡已經有答案了～</span>
        </div>
    </div>

    <script>
        (function() {
            const messageBox = document.getElementById('messageBox');
            const yesBtn = document.getElementById('yesBtn');
            const smileBtn = document.getElementById('smileBtn');

            // 預設訊息 (與 HTML 一致，但這裡稍作保留，用於重置)
            const defaultMessage = '👩🏻‍🦰 你心裡已經有答案了～';

            // 各種有趣的回應
            const responses = [
                '💐 姓陳的女生自帶光芒，當然漂亮！',
                '🌸 陳家女孩的顏值可是經過認證的～',
                '✨ 美是一種主觀，但姓陳的女生常常是客觀的漂亮。',
                '🌟 姓陳 + 女生 = 漂亮，這題是送分題吧！',
                '🍀 我認識的陳姓女生個個都很有氣質呢！',
                '💫 不用懷疑，姓陳的女生就是漂亮！',
                '🎀 陳姓女孩舉手投足都是風景～',
                '🌺 漂亮有很多種，而姓陳的女生剛好每一種都有。',
                '💎 陳家出美女，這是公開的秘密🤫',
                '🌷 根據不負責任統計，姓陳的女生漂亮率高達 99.9%～'
            ];

            const extraSmiles = [
                '😊 你笑起來也很漂亮呀！',
                '🤗 不管姓什麼，自信就是漂亮！',
                '😍 你眼裡有光，這就足夠漂亮了。',
                '🌼 會問這個問題的人，心裡一定住著一位漂亮的陳小姐。',
                '💕 漂亮沒有定義，但善良和笑容永遠加分。'
            ];

            // 隨機取得陣列元素
            function getRandomItem(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            // 更新訊息，加上動畫
            function updateMessage(text) {
                // 淡出效果再更新
                messageBox.innerHTML = `<span>${text}</span>`;
            }

            // 「當然漂亮！」按鈕
            yesBtn.addEventListener('click', function() {
                const randomResponse = getRandomItem(responses);
                updateMessage(randomResponse);
            });

            // 「讓我看看」按鈕
            smileBtn.addEventListener('click', function() {
                // 混合兩種回應，但主要是溫柔/微笑類型
                let reply;
                if (Math.random() < 0.6) {
                    reply = getRandomItem(extraSmiles);
                } else {
                    reply = getRandomItem(responses);
                }
                // 加一點小變化
                if (Math.random() < 0.3) {
                    reply = '🔍 ' + reply;
                }
                updateMessage(reply);
            });

            // 滑鼠移過卡片時稍微變化 (額外趣味)
            const card = document.querySelector('.card');
            card.addEventListener('mouseenter', () => {
                // 不影響主要功能，只是讓邊框陰影稍微更亮
                card.style.boxShadow = '0 25px 45px rgba(180, 100, 130, 0.35), 0 10px 25px rgba(150, 70, 100, 0.2), inset 0 1px 6px rgba(255, 255, 255, 0.9)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.boxShadow = '0 20px 40px rgba(180, 100, 130, 0.25), 0 8px 20px rgba(150, 70, 100, 0.15), inset 0 1px 4px rgba(255, 255, 255, 0.8)';
            });

        })();
    </script>
</body>
</html>
