<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的小站</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 0 auto; padding: 20px; line-height: 1.7; color: #222; }
    h1 { font-size: 22px; margin: 0; }
    .topbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 12px; margin-bottom: 20px; }
    .topbar .actions button { font-size: 13px; padding: 6px 12px; }
    input, textarea { width: 100%; padding: 12px; margin: 6px 0; font-family: inherit; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    textarea { height: 140px; resize: vertical; }
    button { padding: 10px 18px; cursor: pointer; border: none; border-radius: 6px; font-size: 14px; background: #eee; }
    button.primary { background: #222; color: #fff; }
    button.primary:hover { background: #444; }
    button.danger { background: #fee; color: #c00; }
    article { border-bottom: 1px solid #eee; padding: 20px 0; }
    .time { color: #999; font-size: 13px; margin: 4px 0 8px; }
    .content { white-space: pre-wrap; }
    .msg { color: #c00; margin-top: 8px; font-size: 14px; }
    .empty { color: #999; padding: 20px 0; }
    .hidden { display: none; }
    .login-box { max-width: 340px; margin: 60px auto; }
    .login-box h2 { text-align: center; }
  </style>
</head>
<body>

  <!-- 上方標題列 -->
  <div class="topbar">
    <h1>我的小站</h1>
    <div class="actions">
      <button id="btnLogin" class="primary">小編登入</button>
      <button id="btnLogout" class="danger hidden">登出</button>
    </div>
  </div>

  <!-- 登入畫面（未登入時顯示） -->
  <div id="loginView" class="login-box hidden">
    <h2>小編登入</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
    <button id="btnDoLogin" class="primary" style="width:100%">登入</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- 編輯區（登入後顯示） -->
  <div id="editorView" class="hidden">
    <h2>新增文章</h2>
    <input id="title" placeholder="標題">
    <textarea id="content" placeholder="內容..."></textarea>
    <button id="btnAdd" class="primary">發布</button>
    <div class="msg" id="editMsg"></div>
    <h2 style="margin-top:32px">已發布</h2>
    <div id="adminList"></div>
  </div>

  <!-- 文章列表（所有人可見） -->
  <div id="list">載入中...</div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabase = createClient(
      'https://cfxwbghnwwtvuyodrrlj.supabase.co',
      'sb_publishable_iUkJIhqt_P8cu8WZdswqmw_59R0ZJ-_'
    )

    // DOM
    const $ = id => document.getElementById(id)
    const loginView = $('loginView')
    const editorView = $('editorView')
    const listEl = $('list')
    const adminList = $('adminList')
    const btnLogin = $('btnLogin')
    const btnLogout = $('btnLogout')

    // 檢查登入狀態並切換 UI
    async function refreshAuth() {
      const { data: { session } } = await supabase.auth.getSession()
      if (session) {
        loginView.classList.add('hidden')
        editorView.classList.remove('hidden')
        btnLogin.classList.add('hidden')
        btnLogout.classList.remove('hidden')
        loadAdmin()
      } else {
        loginView.classList.add('hidden')
        editorView.classList.add('hidden')
        btnLogin.classList.remove('hidden')
        btnLogout.classList.add('hidden')
      }
      loadPublic()
    }

    // 顯示登入框
    btnLogin.onclick = () => {
      loginView.classList.toggle('hidden')
      editorView.classList.add('hidden')
    }

    // 登出
    btnLogout.onclick = async () => {
      await supabase.auth.signOut()
      refreshAuth()
    }

    // 執行登入
    $('btnDoLogin').onclick = async () => {
      const email = $('email').value.trim()
      const password = $('password').value
      const { error } = await supabase.auth.signInWithPassword({ email, password })
      if (error) {
        $('loginMsg').textContent = error.message
      } else {
        $('loginMsg').textContent = ''
        $('email').value = ''
        $('password').value = ''
        refreshAuth()
      }
    }
    $('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') $('btnDoLogin').click()
    })

    // 新增文章
    $('btnAdd').onclick = async () => {
      const title = $('title').value.trim()
      const content = $('content').value.trim()
      if (!title) { $('editMsg').textContent = '標題不能空白'; return }
      const { error } = await supabase.from('posts').insert({ title, content })
      if (error) {
        $('editMsg').textContent = '發布失敗：' + error.message
      } else {
        $('title').value = ''
        $('content').value = ''
        $('editMsg').textContent = ''
        loadAdmin()
        loadPublic()
      }
    }

    // 刪除
    window.del = async (id) => {
      if (!confirm('確定要刪除這篇文章嗎？')) return
      await supabase.from('posts').delete().eq('id', id)
      loadAdmin()
      loadPublic()
    }

    // 載入公開列表
    async function loadPublic() {
      const { data, error } = await supabase
        .from('posts').select('*')
        .order('created_at', { ascending: false })
      if (error) { listEl.innerHTML = '<div class="empty">載入失敗：' + esc(error.message) + '</div>'; return }
      if (!data.length) { listEl.innerHTML = '<div class="empty">還沒有文章。</div>'; return }
      listEl.innerHTML = data.map(p => `
        <article>
          <h2 style="margin:0 0 4px; font-size:18px">${esc(p.title)}</h2>
          <div class="time">${new Date(p.created_at).toLocaleString('zh-TW')}</div>
          <div class="content">${esc(p.content || '')}</div>
        </article>
      `).join('')
    }

    // 載入後台列表（含刪除按鈕）
    async function loadAdmin() {
      const { data } = await supabase
        .from('posts').select('*')
        .order('created_at', { ascending: false })
      if (!data || !data.length) { adminList.innerHTML = '<div class="empty">還沒有文章。</div>'; return }
      adminList.innerHTML = data.map(p => `
        <article>
          <h3 style="margin:0 0 4px; font-size:16px">${esc(p.title)}</h3>
          <div class="time">${new Date(p.created_at).toLocaleString('zh-TW')}</div>
          <div class="content">${esc(p.content || '')}</div>
          <button class="danger" onclick="del(${p.id})">刪除</button>
        </article>
      `).join('')
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]))
    }

    refreshAuth()
  </script>
</body>
</html>
