<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MDHS|ADMIN">
<meta name="mobile-web-app-capable" content="yes">
<title>MDHS|ADMIN</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%231a2a3a'/%3E%3Cpath d='M50 60h92a10 10 0 0 1 10 10v50a10 10 0 0 1-10 10h-50l-25 22v-22h-17a10 10 0 0 1-10-10V70a10 10 0 0 1 10-10z' fill='%234f9eff'/%3E%3Ccircle cx='75' cy='95' r='6' fill='white'/%3E%3Ccircle cx='96' cy='95' r='6' fill='white'/%3E%3Ccircle cx='117' cy='95' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%231a2a3a'/%3E%3Cpath d='M50 60h92a10 10 0 0 1 10 10v50a10 10 0 0 1-10 10h-50l-25 22v-22h-17a10 10 0 0 1-10-10V70a10 10 0 0 1 10-10z' fill='%234f9eff'/%3E%3Ccircle cx='75' cy='95' r='6' fill='white'/%3E%3Ccircle cx='96' cy='95' r='6' fill='white'/%3E%3Ccircle cx='117' cy='95' r='6' fill='white'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif; background: #0f1a24; color: #e0f0ff; overscroll-behavior: none; }

  .app-container { width: 100%; height: 100vh; height: 100dvh; background: #14202e; display: flex; position: relative; overflow: hidden; }

  .overlay { position: absolute; inset: 0; background: linear-gradient(160deg, #0f1a24 0%, #1a2a3a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; overflow-y: auto; }
  .overlay.hidden { display: none; }
  .card { background: rgba(30, 45, 60, 0.95); padding: 28px 22px; border-radius: 22px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5); width: 100%; max-width: 420px; border: 1px solid rgba(100, 180, 255, 0.3); }
  .card h2 { color: #b8e2ff; font-weight: 500; margin-bottom: 6px; font-size: 1.5rem; text-align: center; }
  .card p { color: #9ab8d4; margin-bottom: 18px; font-size: 0.85rem; text-align: center; }
  .card label { display: block; color: #8dc9ff; font-size: 0.8rem; margin-bottom: 6px; margin-top: 12px; }
  .card input, .card select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #2d4b66; background: #0f1a24; color: #e0f0ff; font-size: 1rem; outline: none; -webkit-appearance: none; }
  .card input:focus, .card select:focus { border-color: #4f9eff; box-shadow: 0 0 0 3px rgba(79, 158, 255, 0.25); }
  .card button { width: 100%; padding: 14px; border-radius: 50px; border: none; background: linear-gradient(135deg, #2b6c9e, #1e4b70); color: white; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 20px; }
  .card button:active { transform: scale(0.98); }
  .card button.secondary { background: transparent; border: 1px solid #2f6d9e; color: #8dc9ff; margin-top: 10px; padding: 12px; font-size: 0.9rem; }
  .error-msg { color: #ff7b7b; font-size: 0.82rem; margin-top: 10px; min-height: 18px; text-align: center; }
  .hint-text { font-size: 0.72rem; color: #587b99; margin-top: 12px; text-align: center; line-height: 1.5; }
  .token-display { background: #0a1520; border: 1px dashed #4f9eff; padding: 10px; border-radius: 10px; color: #7bffb0; font-size: 0.78rem; word-break: break-all; text-align: center; margin-top: 10px; font-family: monospace; user-select: all; }
  .admin-status { padding: 10px 12px; border-radius: 10px; font-size: 0.8rem; margin-top: 10px; text-align: center; }
  .admin-status.has-admin { background: rgba(255, 200, 100, 0.1); color: #ffd98a; border: 1px solid #8a5a1e; }
  .admin-status.no-admin { background: rgba(123, 255, 176, 0.1); color: #7bffb0; border: 1px solid #2d7a4d; }

  /* Loading */
  .loading-screen { position: fixed; inset: 0; background: #0f1a24; display: flex; justify-content: center; align-items: center; z-index: 999; color: #8dc9ff; font-size: 1rem; }
  .loading-screen.hidden { display: none; }

  /* Sidebar (Discord-like) */
  .drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 290px; background: #0e1820; border-right: 1px solid rgba(70, 130, 200, 0.2); display: flex; flex-direction: column; z-index: 95; transform: translateX(-100%); transition: transform 0.25s ease; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-header { padding: 60px 16px 14px; border-bottom: 1px solid rgba(70, 130, 200, 0.15); color: #b8e2ff; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; position: relative; flex-shrink: 0; }
  .sidebar-close { position: absolute; top: 14px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.06); border: none; color: #b8e2ff; font-size: 1.2rem; cursor: pointer; }
  .room-name { font-size: 1rem; color: #e0f0ff; text-transform: none; letter-spacing: 0; margin-top: 4px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .role-badge { font-size: 0.62rem; background: #1e5a86; padding: 2px 8px; border-radius: 20px; color: #cce8ff; }
  .role-badge.admin { background: #8a5a1e; color: #ffe1b0; }

  /* 我的聊天室列表 (Discord-like) */
  .my-rooms-section { border-bottom: 1px solid rgba(70, 130, 200, 0.15); flex-shrink: 0; max-height: 40%; display: flex; flex-direction: column; }
  .my-rooms-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; font-size: 0.68rem; color: #5f87a8; letter-spacing: 1px; text-transform: uppercase; }
  .my-rooms-header button { background: rgba(47, 109, 158, 0.4); border: none; color: #cce8ff; font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .my-rooms-header button:active { background: rgba(47, 109, 158, 0.7); }
  .my-rooms-list { overflow-y: auto; padding: 0 8px 10px; }
  .my-room-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; color: #b8d4ec; cursor: pointer; font-size: 0.85rem; margin-bottom: 3px; word-break: break-all; }
  .my-room-item:active { background: rgba(45, 90, 130, 0.35); }
  .my-room-item.active { background: #1e4b70; color: #fff; font-weight: 500; }
  .my-room-item .lock { flex-shrink: 0; }
  .my-room-item .info { flex: 1; min-width: 0; }
  .my-room-item .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .my-room-item .rcode { font-size: 0.7rem; color: #7fa0bd; margin-top: 1px; }
  .my-room-item.active .rcode { color: #cce8ff; }
  .my-rooms-empty { padding: 16px; text-align: center; color: #587b99; font-size: 0.78rem; }

  .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
  .channel-section-title { font-size: 0.68rem; color: #5f87a8; padding: 10px 8px 6px; letter-spacing: 1px; text-transform: uppercase; }
  .channel-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; color: #b8d4ec; cursor: pointer; font-size: 0.92rem; margin-bottom: 2px; }
  .channel-item:active { background: rgba(45, 90, 130, 0.35); }
  .channel-item.active { background: #1e4b70; color: #fff; font-weight: 500; }
  .channel-item .del-btn { margin-left: auto; font-size: 0.75rem; color: #ff9b9b; opacity: 0.7; padding: 4px 8px; border-radius: 8px; background: transparent; border: none; cursor: pointer; }
  .sidebar-footer { padding: 12px; border-top: 1px solid rgba(70, 130, 200, 0.15); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .sidebar-footer button { width: 100%; padding: 11px; border-radius: 12px; border: 1px dashed #2f6d9e; background: transparent; color: #8dc9ff; font-size: 0.85rem; cursor: pointer; }
  .sidebar-footer button.danger { border-color: #7a2a2a; color: #ff9b9b; }
  .sidebar-footer button.danger:active { background: rgba(122, 42, 42, 0.2); }

  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; position: relative; }
  .chat-header { padding: calc(env(safe-area-inset-top) + 12px) 12px 12px; background: #0e1820; border-bottom: 1px solid rgba(70, 130, 200, 0.2); display: flex; align-items: center; gap: 8px; color: #c6e2ff; flex-shrink: 0; }
  .menu-btn { width: 38px; height: 38px; border-radius: 10px; background: rgba(47, 109, 158, 0.25); border: none; color: #c6e2ff; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .menu-btn:active { background: rgba(47, 109, 158, 0.5); }
  .chat-header h3 { font-weight: 500; font-size: 1rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header .bot-badge { background: #1e3f5a; border-radius: 16px; padding: 4px 10px; font-size: 0.68rem; color: #8dc9ff; border: 1px solid #2f6d9e; flex-shrink: 0; }

  .quick-buttons { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: rgba(15, 25, 35, 0.5); border-bottom: 1px solid rgba(70, 130, 200, 0.15); }
  .quick-buttons:empty { display: none; }
  .quick-btn { padding: 7px 12px; border-radius: 20px; background: #1e4b70; color: #e0f0ff; border: 1px solid #3d8fd9; font-size: 0.8rem; cursor: pointer; }
  .quick-btn:active { background: #2872a6; }

  .messages-area { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { align-self: flex-end; }
  .message.bot { align-self: flex-start; }
  .message.system { align-self: center; max-width: 92%; }
  .message .bubble { padding: 9px 14px; border-radius: 18px; font-size: 0.92rem; line-height: 1.45; word-break: break-word; }
  .message.user .bubble { background: #1f5a87; color: #e7f3ff; border-bottom-right-radius: 4px; }
  .message.bot .bubble { background: #142e40; color: #d4e9ff; border: 1px solid #2a4b62; border-left: 3px solid #3d8fd9; border-bottom-left-radius: 4px; }
  .message.system .bubble { background: rgba(40, 60, 80, 0.6); color: #9dbdd8; font-size: 0.78rem; padding: 6px 12px; border-radius: 18px; }
  .message .sender { font-size: 0.68rem; color: #7f9db8; margin-bottom: 3px; padding-left: 6px; }
  .message.user .sender { text-align: right; padding-right: 6px; }
  .message .sender .role-tag { color: #ffd98a; }
  .message .sender .role-tag.member { color: #8dc9ff; }
  .message img.chat-image { max-width: 100%; border-radius: 12px; margin-top: 4px; cursor: pointer; display: block; }

  .hint { font-size: 0.68rem; color: #6c8ca5; text-align: center; padding: 2px 0 4px; }
  .input-area { padding: 8px 10px calc(env(safe-area-inset-bottom) + 10px); background: #0e1820; border-top: 1px solid rgba(70, 130, 200, 0.2); display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .input-area input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 50px; border: 1px solid #244a64; background: #14202e; color: #ecf5ff; font-size: 1rem; outline: none; min-width: 0; }
  .input-area input[type="text"]:focus { border-color: #3b86c4; }
  .input-area button { background: #1e5a86; border: none; color: white; padding: 0 18px; border-radius: 50px; font-weight: 600; cursor: pointer; font-size: 0.95rem; flex-shrink: 0; height: 44px; }
  .input-area button:active { transform: scale(0.97); }
  .input-area button:disabled { background: #2a3f4f; color: #6d8aa0; }
  .icon-btn { background: rgba(47, 109, 158, 0.35) !important; padding: 0 14px !important; font-size: 1.2rem !important; }
  .icon-btn:active { background: rgba(47, 109, 158, 0.6) !important; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: flex; justify-content: center; align-items: center; z-index: 110; padding: 16px; }
  .modal-backdrop.hidden { display: none; }
  .modal { background: #162635; padding: 22px; border-radius: 20px; width: 100%; max-width: 440px; border: 1px solid #2f6d9e; max-height: 85vh; overflow-y: auto; }
  .modal h3 { color: #b8e2ff; font-weight: 500; margin-bottom: 14px; font-size: 1.15rem; }
  .modal label { display: block; color: #8dc9ff; font-size: 0.78rem; margin-bottom: 6px; margin-top: 12px; }
  .modal input, .modal select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #2d4b66; background: #0f1a24; color: #e0f0ff; font-size: 1rem; outline: none; -webkit-appearance: none; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .modal-actions .confirm { background: #1e5a86; color: white; }
  .modal-actions .cancel { background: transparent; border: 1px solid #3d5f7a; color: #9dbdd8; }

  .empty-state { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #5f87a8; gap: 10px; font-size: 0.9rem; padding: 40px 20px; text-align: center; }
  .empty-state .big { font-size: 2.5rem; opacity: 0.5; }

  .member-item, .cmd-item, .btn-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: rgba(15, 25, 35, 0.6); border-radius: 10px; font-size: 0.85rem; margin-bottom: 6px; }
  .member-item .name { flex: 1; color: #d4e9ff; }
  .member-item .badge { font-size: 0.62rem; padding: 2px 6px; border-radius: 8px; background: #1e5a86; color: #cce8ff; }
  .member-item .badge.admin { background: #8a5a1e; color: #ffe1b0; }
  .member-item .kick-btn { font-size: 0.7rem; padding: 5px 10px; background: #7a2a2a; color: #ffc5c5; border: none; border-radius: 8px; cursor: pointer; }
  .member-item.self { background: rgba(31, 90, 135, 0.4); }
  .cmd-item .cmd-name { color: #7bffb0; font-family: monospace; min-width: 70px; }
  .cmd-item .cmd-resp { flex: 1; color: #d4e9ff; font-size: 0.8rem; word-break: break-all; }
  .cmd-item .del-btn, .btn-item .del-btn { font-size: 0.7rem; padding: 5px 10px; background: #7a2a2a; color: #ffc5c5; border: none; border-radius: 8px; cursor: pointer; }
  .btn-item .btn-label { flex: 1; color: #d4e9ff; }
  .btn-item .btn-type { font-size: 0.62rem; padding: 2px 6px; border-radius: 8px; background: #1e5a86; color: #cce8ff; }

  .room-code-box { padding: 16px; background: #0a1520; border: 1px dashed #4f9eff; border-radius: 12px; color: #7bffb0; font-size: 1.5rem; font-family: monospace; text-align: center; letter-spacing: 3px; user-select: all; margin-top: 4px; }

  .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 80px); left: 50%; transform: translateX(-50%); background: #1e5a86; color: white; padding: 12px 22px; border-radius: 30px; font-size: 0.9rem; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }

  .uploading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 300; color: #b8e2ff; font-size: 1rem; }
  .uploading-overlay.hidden { display: none; }

  @media (min-width: 768px) {
    .drawer-backdrop { display: none; }
    .sidebar { position: relative; transform: none; width: 290px; flex-shrink: 0; }
    .sidebar-close { display: none; }
    .sidebar-header { padding: 18px 18px 14px; }
    .menu-btn { display: none; }
    .chat-header { padding: 16px 22px; }
    .chat-header h3 { font-size: 1.1rem; }
    .messages-area { padding: 20px 18px 10px; }
    .input-area { padding: 14px 20px 18px; }
    .toast { bottom: 30px; }
    .app-container { max-width: 1250px; margin: auto; }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">載入中...</div>

<div class="app-container" id="appContainer">

  <!-- 登入 / 建立畫面 -->
  <div class="overlay hidden" id="joinOverlay">
    <div class="card">
      <h2 id="joinTitle">🔒 加入聊天室</h2>
      <p id="joinSubtitle">輸入聊天室代碼以繼續</p>
      <div id="joinFields">
        <label>聊天室代碼</label>
        <input type="text" id="roomCodeInput" placeholder="例如: 123456" autocomplete="off">
        <label>你的暱稱</label>
        <input type="text" id="nicknameInput" placeholder="輸入暱稱（不能用「管理員」）" autocomplete="off">
        <div id="adminStatusBox"></div>
        <div id="tokenFieldWrap" style="display:none;">
          <label>管理員 Token</label>
          <input type="text" id="tokenInput" placeholder="輸入 Token 成為管理員" autocomplete="off">
        </div>
      </div>
      <div id="createFields" style="display:none;">
        <label>聊天室名稱</label>
        <input type="text" id="newRoomName" placeholder="例如: 我的討論區">
        <label>聊天室代碼</label>
        <input type="text" id="newRoomCode" placeholder="設定一組代碼">
        <label>你的暱稱</label>
        <input type="text" id="newRoomNickname" placeholder="輸入暱稱（不能用「管理員」）" autocomplete="off">
        <p class="hint-text">建立後系統會給您一組管理員 Token，請務必保存！</p>
      </div>
      <button id="joinBtn">加入聊天</button>
      <button class="secondary" id="switchToCreateBtn">＋ 建立新的聊天室</button>
      <div class="error-msg" id="errorMsg"></div>
      <div id="tokenDisplay"></div>
    </div>
  </div>

  <!-- 側邊欄 -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-close" id="closeSidebarBtn">✕</button>
      目前聊天室
      <div class="room-name">
        <span id="currentRoomName">未加入</span>
        <span class="role-badge" id="roleBadge">成員</span>
      </div>
    </div>

    <!-- 我的聊天室列表 (Discord-like) -->
    <div class="my-rooms-section">
      <div class="my-rooms-header">
        <span>我的聊天室</span>
        <button id="addRoomBtn">＋ 加入 / 新增</button>
      </div>
      <div class="my-rooms-list" id="myRoomsList">
        <div class="my-rooms-empty">還沒有加入任何聊天室</div>
      </div>
    </div>

    <div class="channel-list" id="channelList"></div>
    <div class="sidebar-footer">
      <button id="addChannelBtn">＋ 新增頻道</button>
      <button id="viewMembersBtn">👥 成員列表</button>
      <button id="manageCmdsBtn">🤖 管理指令</button>
      <button id="manageBtnsBtn">🔘 管理按鈕</button>
      <button id="showCodeSideBtn">🔑 顯示代碼</button>
      <button id="leaveRoomBtn" class="danger" style="display:none;">🚪 退出聊天室</button>
    </div>
  </aside>

  <!-- 主聊天區 -->
  <main class="chat-main">
    <div class="chat-header">
      <button class="menu-btn" id="openSidebarBtn">☰</button>
      <h3 id="channelTitle"># 請選擇頻道</h3>
      <button class="menu-btn" id="showCodeBtn" title="顯示聊天室代碼" style="font-size:1rem;">🔑</button>
      <span class="bot-badge">🤖</span>
    </div>
    <div class="quick-buttons" id="quickButtons"></div>
    <div class="messages-area" id="messagesArea">
      <div class="empty-state"><div class="big">💬</div><div>加入聊天室後即可開始對話</div></div>
    </div>
    <div class="hint">輸入 /help 查看指令</div>
    <div class="input-area">
      <button class="icon-btn" id="uploadImageBtn" title="上傳圖片" disabled>📷</button>
      <input type="text" id="messageInput" placeholder="請先加入聊天室..." autocomplete="off" disabled>
      <button id="sendBtn" disabled>傳送</button>
      <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
    </div>
  </main>

  <!-- Modal: 聊天室資訊 -->
  <div class="modal-backdrop hidden" id="roomCodeModal">
    <div class="modal" style="max-width: 360px;">
      <h3>🔑 聊天室資訊</h3>
      <label>聊天室名稱</label>
      <div id="roomNameDisplay" style="padding: 12px; background: rgba(15,25,35,0.6); border-radius: 10px; color: #d4e9ff; font-size: 0.95rem;"></div>
      <label>聊天室代碼</label>
      <div class="room-code-box" id="roomCodeDisplay"></div>
      <p style="color:#587b99; font-size:0.72rem; margin-top:10px; text-align:center;">分享這個代碼給朋友，他們就能加入</p>
      <div class="modal-actions">
        <button class="cancel" id="closeCodeBtn">關閉</button>
        <button class="confirm" id="copyCodeBtn">複製代碼</button>

      <div class="error-msg" id="codeError"></div>
    </div>
  </div>

  <!-- Modal: 新增頻道 -->
  <div class="modal-backdrop hidden" id="channelModal">
    <div class="modal">
      <h3>新增頻道</h3>
      <label>頻道名稱</label>
      <input type="text" id="channelNameInput" placeholder="例如: 討論區">
      <label>頻道類型</label>
      <select id="channelTypeSelect">
        <option value="text">💬 文字頻道</option>
        <option value="announcement">📢 公告頻道</option>
        <option value="forum">🗂️ 討論區</option>
      </select>
      <div class="modal-actions">
        <button class="cancel" id="cancelChannelBtn">取消</button>
        <button class="confirm" id="confirmChannelBtn">建立</button>
      </div>
      <div class="error-msg" id="channelError"></div>

  <!-- Modal: 成員列表 -->
  <div class="modal-backdrop hidden" id="membersModal">
    <div class="modal">
      <h3>👥 成員列表</h3>
      <div id="memberList"></div>
      <div class="modal-actions">
        <button class="cancel" id="closeMembersBtn">關閉</button>
      </div>
    </div>
  </div>

  <!-- Modal: 管理指令 -->
  <div class="modal-backdrop hidden" id="cmdsModal">
    <div class="modal">
      <h3>🤖 管理機器人指令</h3>
      <div id="cmdList"></div>
      <label>新增指令（例如 /抽獎）</label>
      <input type="text" id="newCmdName" placeholder="/抽獎">
      <label>回應內容</label>
      <input type="text" id="newCmdResp" placeholder="恭喜中獎！">
      <div class="modal-actions">
        <button class="cancel" id="closeCmdsBtn">關閉</button>
        <button class="confirm" id="addCmdBtn">新增指令</button>
      </div>
      <div class="error-msg" id="cmdError"></div>
    </div>
  </div>

  <!-- Modal: 管理按鈕 -->
  <div class="modal-backdrop hidden" id="btnsModal">
    <div class="modal">
      <h3>🔘 管理自訂按鈕</h3>
      <div id="btnList"></div>
      <label>按鈕文字</label>
      <input type="text" id="newBtnLabel" placeholder="例如: 官方網站">
      <label>動作類型</label>
      <select id="newBtnType">
        <option value="link">🔗 連結（點擊開啟網站）</option>
        <option value="copy">📋 複製文字</option>
      </select>
      <label>動作內容（網址或要複製的文字）</label>
      <input type="text" id="newBtnValue" placeholder="https://... 或要複製的文字">
      <div class="modal-actions">
        <button class="cancel" id="closeBtnsBtn">關閉</button>
        <button class="confirm" id="addBtnBtn">新增按鈕</button>
      </div>
      <div class="error-msg" id="btnError"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="uploading-overlay hidden" id="uploadingOverlay">📤 圖片上傳中...</div>

<script>
(function() {
  'use strict';

  // ========== PWA ==========
  (function setupPWA() {
    const manifest = {
      name: 'MDHS|ADMIN',
      short_name: 'MDHS|ADMIN',
      description: 'MDHS 聊天室',
      start_url: '.',
      display: 'standalone',
      background_color: '#1a2a3a',
      theme_color: '#1a2a3a',
      orientation: 'portrait',
      icons: [{
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%231a2a3a'/%3E%3Cpath d='M50 60h92a10 10 0 0 1 10 10v50a10 10 0 0 1-10 10h-50l-25 22v-22h-17a10 10 0 0 1-10-10V70a10 10 0 0 1 10-10z' fill='%234f9eff'/%3E%3Ccircle cx='75' cy='95' r='6' fill='white'/%3E%3Ccircle cx='96' cy='95' r='6' fill='white'/%3E%3Ccircle cx='117' cy='95' r='6' fill='white'/%3E%3C/svg%3E",
        sizes: '192x192',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'mdhs-admin-v6';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET') return;
          e.respondWith(
            caches.open(CACHE_NAME).then(cache =>
              fetch(e.request).then(res => {
                if (res && res.status === 200 && res.type === 'basic') cache.put(e.request, res.clone());
                return res;
              }).catch(() => cache.match(e.request))
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }
  })();

  // ========== Supabase ==========
  const SB_URL = 'https://ixmkbqpdugazdxbqogxw.supabase.co';
  const SB_KEY = 'sb_publishable_LuHQhy3xbv4b0ko02AZAyA_zCf7mB59';
  const sb = window.supabase.createClient(SB_URL, SB_KEY);

  // ========== 使用者 ID ==========
  function getUserId() {
    let uid = localStorage.getItem('chat_user_id');
    if (!uid) {
      uid = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('chat_user_id', uid);
    }
    return uid;
  }
  const USER_ID = getUserId();

  // ========== Token 儲存 ==========
  function getMyTokens() {
    try { return JSON.parse(localStorage.getItem('chat_tokens') || '{}'); } catch(e) { return {}; }
  }
  function saveToken(roomId, token) {
    const t = getMyTokens(); t[roomId] = token;
    localStorage.setItem('chat_tokens', JSON.stringify(t));
  }
  function removeToken(roomId) {
    const t = getMyTokens(); delete t[roomId];
    localStorage.setItem('chat_tokens', JSON.stringify(t));
  }

  // ========== 我的聊天室列表 (localStorage) ==========
  function getMyRooms() {
    try { return JSON.parse(localStorage.getItem('chat_my_rooms') || '[]'); } catch(e) { return []; }
  }
  function addMyRoom(room) {
    const rooms = getMyRooms();
    if (!rooms.find(r => r.id === room.id)) {
      rooms.push({ id: room.id, name: room.name, code: room.code });
      localStorage.setItem('chat_my_rooms', JSON.stringify(rooms));
    } else {
      // 更新名稱
      const idx = rooms.findIndex(r => r.id === room.id);
      rooms[idx].name = room.name;
      rooms[idx].code = room.code;
      localStorage.setItem('chat_my_rooms', JSON.stringify(rooms));
    }
  }
  function removeMyRoom(roomId) {
    const rooms = getMyRooms().filter(r => r.id !== roomId);
    localStorage.setItem('chat_my_rooms', JSON.stringify(rooms));
  }

  // ========== 狀態 ==========
  let currentRoom = null, currentChannel = null;
  let currentUser = { nickname: '訪客', role: 'member' };
  let channels = [], messages = [], members = [], customCmds = [], customBtns = [];
  let rtMessages = null, rtMembers = null, rtCmds = null, rtBtns = null, heartbeatTimer = null;
  let isCreateMode = false;
  let isJoining = false; // 防止重複點擊

  // ========== DOM ==========
  const $ = id => document.getElementById(id);
  const loadingScreen = $('loadingScreen');
  const joinOverlay = $('joinOverlay'), joinTitle = $('joinTitle'), joinSubtitle = $('joinSubtitle');
  const joinFields = $('joinFields'), createFields = $('createFields');
  const roomCodeInput = $('roomCodeInput'), nicknameInput = $('nicknameInput'), tokenInput = $('tokenInput');
  const adminStatusBox = $('adminStatusBox'), tokenFieldWrap = $('tokenFieldWrap');
  const newRoomName = $('newRoomName'), newRoomCode = $('newRoomCode'), newRoomNickname = $('newRoomNickname');
  const joinBtn = $('joinBtn'), switchToCreateBtn = $('switchToCreateBtn'), errorMsg = $('errorMsg');
  const tokenDisplay = $('tokenDisplay');
  const currentRoomNameEl = $('currentRoomName'), roleBadge = $('roleBadge');
  const myRoomsListEl = $('myRoomsList'), addRoomBtn = $('addRoomBtn');
  const channelListEl = $('channelList'), addChannelBtn = $('addChannelBtn'), viewMembersBtn = $('viewMembersBtn');
  const manageCmdsBtn = $('manageCmdsBtn'), manageBtnsBtn = $('manageBtnsBtn');
  const channelTitle = $('channelTitle'), messagesArea = $('messagesArea');
  const messageInput = $('messageInput'), sendBtn = $('sendBtn'), quickButtons = $('quickButtons');
  const uploadImageBtn = $('uploadImageBtn'), imageFileInput = $('imageFileInput'), uploadingOverlay = $('uploadingOverlay');
  const channelModal = $('channelModal'), channelNameInput = $('channelNameInput');
  const channelTypeSelect = $('channelTypeSelect'), cancelChannelBtn = $('cancelChannelBtn');
  const confirmChannelBtn = $('confirmChannelBtn'), channelError = $('channelError');
  const membersModal = $('membersModal'), memberList = $('memberList'), closeMembersBtn = $('closeMembersBtn');
  const cmdsModal = $('cmdsModal'), cmdList = $('cmdList'), closeCmdsBtn = $('closeCmdsBtn');
  const newCmdName = $('newCmdName'), newCmdResp = $('newCmdResp'), addCmdBtn = $('addCmdBtn'), cmdError = $('cmdError');
  const btnsModal = $('btnsModal'), btnList = $('btnList'), closeBtnsBtn = $('closeBtnsBtn');
  const newBtnLabel = $('newBtnLabel'), newBtnType = $('newBtnType'), newBtnValue = $('newBtnValue');
  const addBtnBtn = $('addBtnBtn'), btnError = $('btnError');
  const toast = $('toast');
  const sidebar = $('sidebar'), drawerBackdrop = $('drawerBackdrop');
  const openSidebarBtn = $('openSidebarBtn'), closeSidebarBtn = $('closeSidebarBtn');
  const showCodeBtn = $('showCodeBtn'), showCodeSideBtn = $('showCodeSideBtn');
  const roomCodeModal = $('roomCodeModal'), roomCodeDisplay = $('roomCodeDisplay');
  const roomNameDisplay = $('roomNameDisplay'), closeCodeBtn = $('closeCodeBtn');
  const copyCodeBtn = $('copyCodeBtn'), codeError = $('codeError');
  const leaveRoomBtn = $('leaveRoomBtn');

  const isAdmin = () => currentUser.role === 'admin';
  const escapeHtml = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
  const channelIcon = type => type === 'announcement' ? '📢' : type === 'forum' ? '🗂️' : '💬';
  const IMG_PREFIX = '[IMG]';

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function openDrawer() { sidebar.classList.add('open'); drawerBackdrop.classList.add('open'); }
  function closeDrawer() { sidebar.classList.remove('open'); drawerBackdrop.classList.remove('open'); }
  openSidebarBtn.addEventListener('click', openDrawer);
  closeSidebarBtn.addEventListener('click', closeDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);

  // ========== 暱稱驗證 ==========
  function validateNickname(name) {
    const n = (name || '').trim();
    if (!n) return { ok: false, msg: '請輸入暱稱' };
    if (n === '管理員') return { ok: false, msg: '暱稱不能叫「管理員」' };
    if (n.length > 12) return { ok: false, msg: '暱稱不能超過 12 個字' };
    return { ok: true, name: n };
  }

  // ========== 檢查房間是否有「其他」管理員 ==========
  async function checkRoomHasAdmin(roomId) {
    const { data, error } = await sb.from('members')
      .select('id, nickname, role, user_id')
      .eq('room_id', roomId)
      .eq('role', 'admin')
      .neq('user_id', USER_ID)
      .limit(1);
    if (error) { console.error('checkRoomHasAdmin:', error); return null; }
    if (data && data.length > 0) return data[0];
    return null;
  }

  // ========== 顯示聊天室代碼 ==========
  function openCodeModal() {
    if (!currentRoom) { showToast('尚未加入聊天室'); return; }
    roomNameDisplay.textContent = currentRoom.name;
    roomCodeDisplay.textContent = currentRoom.code;
    codeError.textContent = '';
    roomCodeModal.classList.remove('hidden');
    closeDrawer();
  }
  showCodeBtn.addEventListener('click', openCodeModal);
  showCodeSideBtn.addEventListener('click', openCodeModal);
  closeCodeBtn.addEventListener('click', () => roomCodeModal.classList.add('hidden'));
  copyCodeBtn.addEventListener('click', async () => {
    if (!currentRoom) return;
    const code = currentRoom.code;
    try {
      await navigator.clipboard.writeText(code);
      codeError.textContent = '✅ 已複製！';
      codeError.style.color = '#7bffb0';
      setTimeout(() => { codeError.textContent = ''; }, 1500);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      codeError.textContent = '✅ 已複製！';
      codeError.style.color = '#7bffb0';
      setTimeout(() => { codeError.textContent = ''; }, 1500);
    }
  });

  // ========== 退出聊天室 ==========
  leaveRoomBtn.addEventListener('click', async () => {
    if (!currentRoom) return;
    const isAdminLeaving = isAdmin();
    const msg = isAdminLeaving
      ? '⚠️ 你是管理員，退出後管理員位置會釋放給下一個人。\n\n確定要退出嗎？'
      : '確定要退出聊天室嗎？';
    if (!confirm(msg)) return;

    try {
      // 發送系統訊息到「加入」頻道
      await sendSystemMessage(`${currentUser.nickname} 退出了聊天室${isAdminLeaving ? '（管理員位置已釋放）' : ''}`);
      // 從 members 移除自己
      await sb.from('members').delete().eq('room_id', currentRoom.id).eq('user_id', USER_ID);
      // 從列表移除
      removeMyRoom(currentRoom.id);
      // 清除 Token
      removeToken(currentRoom.id);
      // 清除自動登入
      localStorage.removeItem('chat_last_room_code');
      localStorage.removeItem('chat_last_nickname');
    } catch (e) {
      console.error(e);
    }
    alert('已退出聊天室');
    location.reload();
  });

  // ========== 發送系統訊息到「加入」頻道 ==========
  async function sendSystemMessage(text) {
    if (!currentRoom) return;
    // 找「加入」頻道，找不到就用第一個頻道
    let joinChannel = channels.find(c => c.name === '加入');
    if (!joinChannel) joinChannel = channels[0];
    if (!joinChannel) return;
    await sb.from('messages').insert({
      channel_id: joinChannel.id,
      text: text,
      sender: 'system',
      is_system: true
    });
  }

  // ========== 自動清理過期聊天室 ==========
  async function cleanupExpiredRooms() {
    const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
    const { data, error } = await sb.from('rooms').select('id').lt('last_active', sevenDaysAgo);
    if (error || !data || !data.length) return;
    for (const r of data) {
      await sb.from('rooms').delete().eq('id', r.id);
    }
    console.log('已清理 ' + data.length + ' 個過期聊天室');
  }

  async function touchRoom() {
    if (!currentRoom) return;
    await sb.from('rooms').update({ last_active: new Date().toISOString() }).eq('id', currentRoom.id);
  }

  // ========== 資料載入 ==========
  async function loadChannels(roomId) {
    const { data } = await sb.from('channels').select('*').eq('room_id', roomId).order('created_at');
    channels = data || [];
    renderChannelList();
  }
  async function loadMessages(channelId) {
    const { data } = await sb.from('messages').select('*').eq('channel_id', channelId).order('created_at');
    messages = data || [];
    renderMessages();
  }
  async function loadMembers(roomId) {
    const { data } = await sb.from('members').select('*').eq('room_id', roomId).order('created_at');
    members = data || [];
    renderMembers();
  }
  async function loadCmds(roomId) {
    const { data } = await sb.from('custom_commands').select('*').eq('room_id', roomId).order('created_at');
    customCmds = data || [];
    renderCmds();
  }
  async function loadBtns(roomId) {
    const { data } = await sb.from('custom_buttons').select('*').eq('room_id', roomId).order('created_at');
    customBtns = data || [];
    renderQuickButtons();
    renderBtns();
  }
  async function findRoomByCode(code) {
    const { data } = await sb.from('rooms').select('*').eq('code', code.toLowerCase()).maybeSingle();
    return data;
  }

  // ========== 渲染：我的聊天室列表 ==========
  function renderMyRooms() {
    const rooms = getMyRooms();
    if (!rooms.length) {
      myRoomsListEl.innerHTML = '<div class="my-rooms-empty">還沒有加入任何聊天室</div>';
      return;
    }
    let html = '';
    rooms.forEach(r => {
      const active = currentRoom && currentRoom.id === r.id ? 'active' : '';
      html += `<div class="my-room-item ${active}" data-room-id="${r.id}">
        <span class="lock">🔒</span>
        <div class="info">
          <div class="rname">${escapeHtml(r.name)}</div>
          <div class="rcode">#${escapeHtml(r.code)}</div>
        </div>
      </div>`;
    });
    myRoomsListEl.innerHTML = html;
    myRoomsListEl.querySelectorAll('.my-room-item').forEach(el => {
      el.addEventListener('click', () => switchToRoom(el.dataset.roomId));
    });
  }

  async function switchToRoom(roomId) {
    if (currentRoom && currentRoom.id === roomId) { closeDrawer(); return; }
    const rooms = getMyRooms();
    const target = rooms.find(r => r.id === roomId);
    if (!target) return;
    closeDrawer();
    // 重置並加入新房間
    await joinRoomByCode(target.code, currentUser.nickname, true);
  }

  // ========== 渲染：頻道列表 ==========
  function renderChannelList() {
    if (!channels.length) { channelListEl.innerHTML = ''; return; }
    let html = '';
    const normal = channels.filter(c => c.type !== 'forum');
    const forums = channels.filter(c => c.type === 'forum');
    if (normal.length) {
      html += '<div class="channel-section-title">頻道</div>';
      normal.forEach(ch => html += channelItemHtml(ch));
    }
    if (forums.length) {
      html += '<div class="channel-section-title">討論區</div>';
      forums.forEach(ch => html += channelItemHtml(ch));
    }
    channelListEl.innerHTML = html;
    channelListEl.querySelectorAll('.channel-item').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.classList.contains('del-btn')) return;
        switchChannel(el.dataset.channelId);
        closeDrawer();
      });
    });
    channelListEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        if (!isAdmin()) { alert('只有管理員可以刪除頻道'); return; }
        if (ch.name === '加入') { alert('「加入」頻道無法刪除'); return; }
        if (!confirm('確定要刪除此頻道嗎？')) return;
        await sb.from('channels').delete().eq('id', btn.dataset.channelId);
        await loadChannels(currentRoom.id);
        if (!channels.find(c => c.id === currentChannel?.id)) {
          if (channels.length) switchChannel(channels[0].id);
          else { currentChannel = null; renderMessages(); }
        }
      });
    });
  }
  function channelItemHtml(ch) {
    const active = ch.id === currentChannel?.id ? 'active' : '';
    // 「加入」頻道不能被刪除
    const canDelete = isAdmin() && ch.name !== '加入';
    const delBtn = canDelete ? `<button class="del-btn" data-channel-id="${ch.id}">✕</button>` : '';
    return `<div class="channel-item ${active}" data-channel-id="${ch.id}">
      <span>${channelIcon(ch.type)}</span><span>${escapeHtml(ch.name)}</span>${delBtn}
    </div>`;
  }

  // ========== 渲染：訊息 ==========
  function getRoleOfSender(senderName) {
    const m = members.find(x => x.nickname === senderName);
    return m ? m.role : 'member';
  }
  function renderMessages() {
    if (!currentChannel) {
      messagesArea.innerHTML = `<div class="empty-state"><div class="big">💬</div><div>請選擇一個頻道</div></div>`;
      return;
    }
    if (!messages.length) {
      messagesArea.innerHTML = `<div class="empty-state"><div class="big">✨</div><div>這個頻道還沒有訊息</div></div>`;
      return;
    }
    let html = '';
    messages.forEach(msg => {
      if (msg.is_system) {
        html += `<div class="message system"><div class="bubble">${escapeHtml(msg.text)}</div></div>`;
      } else {
        const cls = msg.is_bot ? 'bot' : 'user';
        let label = '';
        if (msg.is_bot) {
          label = '🤖 小幫手';
        } else {
          const role = getRoleOfSender(msg.sender);
          const roleTag = role === 'admin'
            ? '<span class="role-tag">[管理員]</span>'
            : '<span class="role-tag member">[成員]</span>';
          label = `${escapeHtml(msg.sender)} ${roleTag}`;
        }
        let contentHtml = '';
        if (msg.text && msg.text.startsWith(IMG_PREFIX)) {
          const imgUrl = msg.text.substring(IMG_PREFIX.length);
          contentHtml = `<img class="chat-image" src="${escapeHtml(imgUrl)}" onclick="window.open('${escapeHtml(imgUrl)}','_blank')">`;
        } else {
          contentHtml = escapeHtml(msg.text).replace(/\n/g, '<br>');
        }
        html += `<div class="message ${cls}"><div class="sender">${label}</div><div class="bubble">${contentHtml}</div></div>`;
      }
    });
    messagesArea.innerHTML = html;
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  // ========== 渲染：成員 ==========
  function renderMembers() {
    if (!members.length) {
      memberList.innerHTML = '<div style="color:#7f9db8;text-align:center;padding:20px;">目前沒有成員</div>';
      return;
    }
    let html = '';
    members.forEach(m => {
      const isSelf = m.user_id === USER_ID;
      const isMemberAdmin = m.role === 'admin';
      const kickBtn = (isAdmin() && !isSelf && !isMemberAdmin)
        ? `<button class="kick-btn" data-user-id="${m.user_id}">踢出</button>` : '';
      const selfTag = isSelf ? ' <span style="color:#7bffb0;font-size:0.7rem;">(你)</span>' : '';
      html += `<div class="member-item ${isSelf ? 'self' : ''}">
        <span class="name">${escapeHtml(m.nickname)}${selfTag}</span>
        <span class="badge ${isMemberAdmin ? 'admin' : ''}">${isMemberAdmin ? '管理員' : '成員'}</span>
        ${kickBtn}
      </div>`;
    });
    memberList.innerHTML = html;

  function renderQuickButtons() {
    if (!customBtns.length) { quickButtons.innerHTML = ''; return; }

      html += `<button class="quick-btn" data-btn-id="${b.id}">${escapeHtml(b.label)}</button>`;
    });

    quickButtons.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const b = customBtns.find(x => x.id === btn.dataset.btnId);
        if (!b) return;
        if (b.action_type === 'link') {
          window.open(b.action_value, '_blank');
        } else if (b.action_type === 'copy') {
          navigator.clipboard.writeText(b.action_value).then(() => {
            showToast('✅ 已複製：' + b.action_value.substring(0, 30) + (b.action_value.length > 30 ? '...' : ''));
          }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = b.action_value;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ 已複製');
          });
        }
      });
    });
  }

  function updateRoomUI() {

    currentRoomNameEl.textContent = currentRoom.name;

  // ========== 核心：加入房間（依代碼） ==========
  async function joinRoomByCode(code, nickname, skipValidation) {
    if (isJoining) return;
    isJoining = true;
    try {
      code = (code || '').trim().toLowerCase();
      if (!code) { errorMsg.textContent = '請輸入聊天室代碼'; return; }

      if (!skipValidation) {
        const v = validateNickname(nickname);
        if (!v.ok) { errorMsg.textContent = v.msg; return; }
        nickname = v.name;
      }

      errorMsg.textContent = '載入中...';
      await cleanupExpiredRooms();

      const room = await findRoomByCode(code);
      if (!room) {
        errorMsg.textContent = '找不到此聊天室';
        return;
      }

      // 檢查是否有「其他」管理員
      const otherAdmin = await checkRoomHasAdmin(room.id);
      const savedToken = getMyTokens()[room.id];
      const tokenValue = tokenInput.value.trim();
      const hasValidToken = (tokenValue && tokenValue === room.admin_token) || (savedToken && savedToken === room.admin_token);

      // 查自己是否已經在 members 裡（保留原本角色）
      const { data: myMembership } = await sb.from('members')
        .select('*').eq('room_id', room.id).eq('user_id', USER_ID).maybeSingle();

      let role = 'member';

      if (myMembership) {
        // 我本來就在，保留原本角色
        role = myMembership.role;
      } else if (otherAdmin) {
        // 有其他管理員，不能搶
        role = 'member';
        if (hasValidToken) showToast('此聊天室已有管理員，將以一般成員身分加入');
      } else {
        // 沒有其他管理員
        if (hasValidToken) {
          role = 'admin';
          if (tokenValue) saveToken(room.id, tokenValue);
        } else if (tokenValue && tokenValue !== room.admin_token) {
          errorMsg.textContent = 'Token 錯誤，將以一般成員身分加入';
          await new Promise(r => setTimeout(r, 800));
        }
      }

      currentRoom = room;
      currentUser = { nickname, role };

      // 儲存自動登入資訊
      localStorage.setItem('chat_last_room_code', code);
      localStorage.setItem('chat_last_nickname', nickname);

      // 加入我的聊天室列表
      addMyRoom(room);

      joinOverlay.classList.add('hidden');
      updateRoomUI();
      renderMyRooms();

      await touchRoom();
      await loadChannels(room.id);
      await loadMembers(room.id);
      await loadCmds(room.id);
      await loadBtns(room.id);

      // 註冊成員（upsert）
      await sb.from('members').upsert({
        room_id: room.id,
        user_id: USER_ID,
        nickname: nickname,
        role: role,
        last_seen: new Date().toISOString()
      }, { onConflict: 'room_id,user_id' });

      if (channels.length) {
        switchChannel(channels[0].id);
        // 系統訊息到「加入」頻道
        await sendSystemMessage(`${nickname} 加入了聊天室`);
      } else {
        const { data } = await sb.from('channels').insert({ room_id: room.id, name: '一般', type: 'text' }).select().single();
        if (data) { await loadChannels(room.id); switchChannel(data.id); }
      }

      messageInput.disabled = false;
      sendBtn.disabled = false;
      uploadImageBtn.disabled = false;
      messageInput.placeholder = '輸入訊息...';
      subscribeRealtime();
      startHeartbeat();
    } catch (err) {
      console.error(err);
      errorMsg.textContent = '載入失敗：' + (err.message || '未知錯誤');
    } finally {
      isJoining = false;
    }
  }

  // ========== 建立房間 ==========
  async function tryCreateRoom() {
    const name = newRoomName.value.trim();
    const code = newRoomCode.value.trim().toLowerCase();
    const nickname = newRoomNickname.value.trim();

    if (!name || !code) { errorMsg.textContent = '請填寫名稱與代碼'; return; }
    const v = validateNickname(nickname);
    if (!v.ok) { errorMsg.textContent = v.msg; return; }

    errorMsg.textContent = '建立中...';
    await cleanupExpiredRooms();

    const existing = await findRoomByCode(code);
    if (existing) { errorMsg.textContent = '此代碼已被使用'; return; }

    const adminToken = 'adm_' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
    const { data: room, error } = await sb.from('rooms').insert({ name, code, admin_token: adminToken }).select().single();
    if (error || !room) { errorMsg.textContent = '建立失敗：' + (error?.message || ''); return; }

    // 建立預設頻道（包含「加入」頻道）
    await sb.from('channels').insert([
      { room_id: room.id, name: '加入', type: 'announcement' },
      { room_id: room.id, name: '一般', type: 'text' },
      { room_id: room.id, name: '討論區', type: 'forum' }
    ]);

    currentRoom = room;
    currentUser = { nickname: v.name, role: 'admin' };
    saveToken(room.id, adminToken);
    localStorage.setItem('chat_last_room_code', code);
    localStorage.setItem('chat_last_nickname', v.name);
    addMyRoom(room);

    joinOverlay.classList.add('hidden');
    updateRoomUI();
    renderMyRooms();
    await loadChannels(room.id);
    await loadMembers(room.id);
    await loadCmds(room.id);
    await loadBtns(room.id);
    await sb.from('members').upsert({
      room_id: room.id, user_id: USER_ID, nickname: v.name,
      role: 'admin', last_seen: new Date().toISOString()
    }, { onConflict: 'room_id,user_id' });

    switchChannel(channels[0].id);
    await sendSystemMessage(`聊天室「${name}」已建立！${v.name} 是管理員。`);

    tokenDisplay.innerHTML = `<div class="token-display">🔑 Token（請保存）：<br>${adminToken}</div>`;
    alert('🎉 聊天室已建立！\n\n管理員 Token：\n' + adminToken + '\n\n請保存好！下次加入時貼上即可恢復管理員身分。\n\n📌 此聊天室若 7 天無人使用，將自動刪除並釋放代碼。');

    messageInput.disabled = false;
    sendBtn.disabled = false;
    uploadImageBtn.disabled = false;
    messageInput.placeholder = '輸入訊息...';
    subscribeRealtime();
    startHeartbeat();
  }

  // ========== Realtime ==========
  function subscribeRealtime() {
    if (rtMessages) sb.removeChannel(rtMessages);
    if (rtMembers) sb.removeChannel(rtMembers);
    if (rtCmds) sb.removeChannel(rtCmds);
    if (rtBtns) sb.removeChannel(rtBtns);

    rtMessages = sb.channel('rt-messages-' + currentRoom.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const m = payload.new;
        if (currentChannel && m.channel_id === currentChannel.id) {
          messages.push(m);
          renderMessages();
        }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'channels' }, async () => {
        if (currentRoom) {
          await loadChannels(currentRoom.id);
          if (!channels.length) { currentChannel = null; renderMessages(); }
          else if (!channels.find(c => c.id === currentChannel?.id)) switchChannel(channels[0].id);
        }
      })
      .subscribe();

    rtMembers = sb.channel('rt-members-' + currentRoom.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, async payload => {
        if (payload.eventType === 'DELETE' && payload.old && payload.old.user_id === USER_ID) {
          alert('您已被管理員踢出此聊天室');
          removeMyRoom(currentRoom.id);
          localStorage.removeItem('chat_last_room_code');
          localStorage.removeItem('chat_last_nickname');
          location.reload();
          return;
        }
        if (currentRoom) await loadMembers(currentRoom.id);
      })
      .subscribe();

    rtCmds = sb.channel('rt-cmds-' + currentRoom.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'custom_commands' }, async () => {
        if (currentRoom) await loadCmds(currentRoom.id);
      })
      .subscribe();

    rtBtns = sb.channel('rt-btns-' + currentRoom.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'custom_buttons' }, async () => {
        if (currentRoom) await loadBtns(currentRoom.id);
      })
      .subscribe();
  }

  function startHeartbeat() {
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(async () => {
      if (!currentRoom || !currentUser.nickname) return;
      await sb.from('members').update({ last_seen: new Date().toISOString() })
        .eq('room_id', currentRoom.id).eq('user_id', USER_ID);
      await touchRoom();
    }, 30000);
  }

  // ========== 圖片上傳 ==========
  uploadImageBtn.addEventListener('click', () => {
    if (!currentChannel) { showToast('請先選擇頻道'); return; }
    imageFileInput.click();
  });
  imageFileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !currentChannel) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('圖片不能超過 5MB');
      imageFileInput.value = '';
      return;
    }
    uploadingOverlay.classList.remove('hidden');
    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const fileName = `${USER_ID}_${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('chat-images').upload(fileName, file, {
        cacheControl: '3600', upsert: false
      });
      if (error) throw error;
      const { data: urlData } = sb.storage.from('chat-images').getPublicUrl(fileName);
      const publicUrl = urlData.publicUrl;
      await sb.from('messages').insert({
        channel_id: currentChannel.id,
        text: IMG_PREFIX + publicUrl,
        sender: currentUser.nickname,
        is_bot: false, is_system: false
      });
      await touchRoom();
      showToast('✅ 圖片已傳送');
    } catch (err) {
      console.error(err);
      showToast('❌ 上傳失敗：' + (err.message || '未知錯誤'));
    } finally {
      uploadingOverlay.classList.add('hidden');
      imageFileInput.value = '';
    }
  });

  // ========== 機器人 ==========
  function handleBotCommand(cmd, full) {
    const c = cmd.trim().toLowerCase();
    const custom = customCmds.find(x => x.command.toLowerCase() === c);
    if (custom) return custom.response;

    if (c === '/規則' || c === '/rule') return `📋 聊天室規則：\n1. 尊重所有成員\n2. 禁止洗版廣告\n3. 保持友善\n4. 使用 /help 查看指令`;
    if (c === '/help' || c === '/幫助') {
      let help = `🤖 可用指令：\n/規則 - 規則\n/help - 幫助\n/時間 - 時間\n/問候 - 打招呼\n/頻道 - 列出頻道`;
      if (isAdmin()) help += `\n\n👑 管理員指令：\n/set /指令名 回應內容\n/del /指令名`;
      if (customCmds.length) help += `\n\n📝 自訂指令：\n` + customCmds.map(x => x.command).join(', ');
      return help;
    }
    if (c === '/時間' || c === '/time') return `🕒 現在時間：${new Date().toLocaleTimeString('zh-TW', { hour12: false })}`;
    if (c === '/問候' || c === '/hello') return `你好呀，${escapeHtml(currentUser.nickname)}！`;
    if (c === '/頻道' || c === '/channels') return `📁 頻道：\n${channels.map(ch => `${channelIcon(ch.type)} ${ch.name}`).join('\n')}`;
    if (c.startsWith('/')) return `❓ 未知指令「${full}」。輸入 /help 查看幫助。`;
    return null;
  }

  async function sendUserMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentChannel) return;

    if (isAdmin() && text.startsWith('/set ')) {
      const rest = text.substring(5).trim();
      const spaceIdx = rest.indexOf(' ');
      if (spaceIdx === -1) { showToast('格式：/set /指令名 回應內容'); return; }
      let cmdName = rest.substring(0, spaceIdx).trim();
      const resp = rest.substring(spaceIdx + 1).trim();
      if (!cmdName.startsWith('/')) cmdName = '/' + cmdName;
      await sb.from('custom_commands').upsert({ room_id: currentRoom.id, command: cmdName, response: resp }, { onConflict: 'room_id,command' });
      await loadCmds(currentRoom.id);
      messageInput.value = '';
      showToast('✅ 已設定指令 ' + cmdName);
      return;
    }
    if (isAdmin() && text.startsWith('/del ')) {
      let cmdName = text.substring(5).trim();
      if (!cmdName.startsWith('/')) cmdName = '/' + cmdName;
      await sb.from('custom_commands').delete().eq('room_id', currentRoom.id).eq('command', cmdName);
      await loadCmds(currentRoom.id);
      messageInput.value = '';
      showToast('✅ 已刪除指令 ' + cmdName);
      return;
    }

    await sb.from('messages').insert({
      channel_id: currentChannel.id,
      text: escapeHtml(text),
      sender: currentUser.nickname,
      is_bot: false, is_system: false
    });
    await touchRoom();
    messageInput.value = '';

    if (text.startsWith('/')) {
      const reply = handleBotCommand(text, text);
      if (reply) {
        setTimeout(async () => {
          await sb.from('messages').insert({
            channel_id: currentChannel.id,
            text: escapeHtml(reply),
            sender: '小幫手', is_bot: true, is_system: false
          });
        }, 200);
      }
    }
  }

  // ========== 事件綁定 ==========
  joinBtn.addEventListener('click', () => {
    if (isCreateMode) tryCreateRoom();
    else joinRoomByCode(roomCodeInput.value, nicknameInput.value);
  });
  switchToCreateBtn.addEventListener('click', () => setCreateMode(!isCreateMode));

  [roomCodeInput, nicknameInput, tokenInput, newRoomName, newRoomCode, newRoomNickname].forEach(inp => {
    if (inp) inp.addEventListener('keypress', e => {
      if (e.key === 'Enter') { e.preventDefault(); joinBtn.click(); }
    });
  });

  sendBtn.addEventListener('click', sendUserMessage);
  messageInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendUserMessage(); }
  });

  addChannelBtn.addEventListener('click', openChannelModal);
  cancelChannelBtn.addEventListener('click', closeChannelModal);
  confirmChannelBtn.addEventListener('click', confirmAddChannel);
  viewMembersBtn.addEventListener('click', openMembersModal);
  closeMembersBtn.addEventListener('click', closeMembersModal);
  manageCmdsBtn.addEventListener('click', openCmdsModal);
  closeCmdsBtn.addEventListener('click', closeCmdsModal);
  addCmdBtn.addEventListener('click', addCmd);
  manageBtnsBtn.addEventListener('click', openBtnsModal);
  closeBtnsBtn.addEventListener('click', closeBtnsModal);
  addBtnBtn.addEventListener('click', addBtn);

  // 側邊欄「＋ 加入 / 新增」按鈕
  addRoomBtn.addEventListener('click', () => {
    closeDrawer();
    joinOverlay.classList.remove('hidden');
    setCreateMode(false);
    roomCodeInput.value = '';
    roomCodeInput.focus();
  });

  // ========== 初始化 / 自動登入 ==========
  async function init() {
    renderMyRooms();

    // 嘗試自動登入
    const lastCode = localStorage.getItem('chat_last_room_code');
    const lastNick = localStorage.getItem('chat_last_nickname');

    if (lastCode && lastNick) {
      try {
        const room = await findRoomByCode(lastCode);
        if (room) {
          // 檢查我是否還是成員
          const { data: myMembership } = await sb.from('members')
            .select('*').eq('room_id', room.id).eq('user_id', USER_ID).maybeSingle();

          if (myMembership) {
            // 自動登入
            currentUser.nickname = myMembership.nickname || lastNick;
            await joinRoomByCode(lastCode, currentUser.nickname, true);
            loadingScreen.classList.add('hidden');
            return;
          } else {
            // 已退出，清除
            localStorage.removeItem('chat_last_room_code');
            localStorage.removeItem('chat_last_nickname');
          }
        } else {
          // 房間不存在，清除
          localStorage.removeItem('chat_last_room_code');
          localStorage.removeItem('chat_last_nickname');
        }
      } catch (err) {
        console.error('自動登入失敗:', err);
      }
    }

    // 沒有自動登入成功，顯示登入畫面
    loadingScreen.classList.add('hidden');
    joinOverlay.classList.remove('hidden');
    roomCodeInput.focus();
  }

  init();
})();
</script>
</body>
