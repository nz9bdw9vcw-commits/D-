<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif; background: #0f1a24; color: #e0f0ff; overscroll-behavior: none; }

  body { --accent: #1e5a86; --accent-hover: #2872a6; --bubble-user: #1f5a87; --border-accent: #3d8fd9; }
  body.theme-purple { --accent: #7a4dbf; --accent-hover: #9261d4; --bubble-user: #6a3fb0; --border-accent: #a06be0; }
  body.theme-green { --accent: #2d8a5c; --accent-hover: #36a06d; --bubble-user: #257a4f; --border-accent: #4ac088; }
  body.theme-red { --accent: #c0392b; --accent-hover: #d94b3d; --bubble-user: #a5301f; --border-accent: #e05a4a; }
  body.theme-pink { --accent: #c94b8c; --accent-hover: #d9609d; --bubble-user: #b03d7a; --border-accent: #e075a5; }

  body.font-small .message .bubble { font-size: 0.82rem; }
  body.font-medium .message .bubble { font-size: 0.92rem; }
  body.font-large .message .bubble { font-size: 1.05rem; }
  body.font-xlarge .message .bubble { font-size: 1.2rem; }
  body.font-large .message .sender,
  body.font-xlarge .message .sender { font-size: 0.78rem; }
  body.font-large .input-area input[type="text"],
  body.font-xlarge .input-area input[type="text"] { font-size: 1.1rem; }

  body.font-jhenghei { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; }
  body.font-pingfang { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  body.font-noto { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }

  .app-container { width: 100%; height: 100vh; height: 100dvh; background: #14202e; display: flex; position: relative; overflow: hidden; }

  .overlay { position: absolute; inset: 0; background: linear-gradient(160deg, #0f1a24 0%, #1a2a3a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; overflow-y: auto; }
  .overlay.hidden { display: none; }
  .card { background: rgba(30, 45, 60, 0.95); padding: 28px 22px; border-radius: 22px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5); width: 100%; max-width: 420px; border: 1px solid rgba(100, 180, 255, 0.3); }
  .card h2 { color: #b8e2ff; font-weight: 500; margin-bottom: 6px; font-size: 1.5rem; text-align: center; }
  .card p { color: #9ab8d4; margin-bottom: 18px; font-size: 0.85rem; text-align: center; }
  .card label { display: block; color: #8dc9ff; font-size: 0.8rem; margin-bottom: 6px; margin-top: 12px; }
  .card input, .card select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #2d4b66; background: #0f1a24; color: #e0f0ff; font-size: 1rem; outline: none; -webkit-appearance: none; }
  .card input:focus, .card select:focus { border-color: #4f9eff; box-shadow: 0 0 0 3px rgba(79, 158, 255, 0.25); }
  .card button { width: 100%; padding: 14px; border-radius: 50px; border: none; background: linear-gradient(135deg, #2b6c9e, #1e4b70); color: white; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 20px; }
  .card button:active { transform: scale(0.98); }
  .card button.secondary { background: transparent; border: 1px solid #2f6d9e; color: #8dc9ff; margin-top: 10px; padding: 12px; font-size: 0.9rem; }
  .error-msg { color: #ff7b7b; font-size: 0.82rem; margin-top: 10px; min-height: 18px; text-align: center; }
  .hint-text { font-size: 0.72rem; color: #587b99; margin-top: 12px; text-align: center; line-height: 1.5; }
  .token-display { background: #0a1520; border: 1px dashed #4f9eff; padding: 10px; border-radius: 10px; color: #7bffb0; font-size: 0.78rem; word-break: break-all; text-align: center; margin-top: 10px; font-family: monospace; user-select: all; }

  .admin-status.no-admin { background: rgba(123, 255, 176, 0.1); color: #7bffb0; border: 1px solid #2d7a4d; }

  .loading-screen { position: fixed; inset: 0; background: #0f1a24; display: flex; justify-content: center; align-items: center; z-index: 999; color: #8dc9ff; font-size: 1rem; text-align: center; padding: 20px; }
  .loading-screen.hidden { display: none; }

  .drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 290px; background: #0e1820; border-right: 1px solid rgba(70, 130, 200, 0.2); display: flex; flex-direction: column; z-index: 95; transform: translateX(-100%); transition: transform 0.25s ease; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-header { padding: 60px 16px 14px; border-bottom: 1px solid rgba(70, 130, 200, 0.15); color: #b8e2ff; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; position: relative; flex-shrink: 0; }
  .sidebar-close { position: absolute; top: 14px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.06); border: none; color: #b8e2ff; font-size: 1.2rem; cursor: pointer; }
  .room-name { font-size: 1rem; color: #e0f0ff; text-transform: none; letter-spacing: 0; margin-top: 4px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .role-badge { font-size: 0.62rem; background: var(--accent); padding: 2px 8px; border-radius: 20px; color: #cce8ff; }

  .my-rooms-section { border-bottom: 1px solid rgba(70, 130, 200, 0.15); flex-shrink: 0; max-height: 40%; display: flex; flex-direction: column; }

  .my-room-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; color: #b8d4ec; cursor: pointer; font-size: 0.85rem; margin-bottom: 3px; word-break: break-all; }
  .my-room-item:active { background: rgba(45, 90, 130, 0.35); }
  .my-room-item.active { background: var(--accent); color: #fff; font-weight: 500; }
  .my-room-item .lock { flex-shrink: 0; }
  .my-room-item .info { flex: 1; min-width: 0; }
  .my-room-item .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .my-room-item .rcode { font-size: 0.7rem; color: #7fa0bd; margin-top: 1px; }
  .my-room-item.active .rcode { color: #cce8ff; }
  .my-rooms-empty { padding: 16px; text-align: center; color: #587b99; font-size: 0.78rem; }

  .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
  .channel-section-title { font-size: 0.68rem; color: #5f87a8; padding: 10px 8px 6px; letter-spacing: 1px; text-transform: uppercase; }
  .channel-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; color: #b8d4ec; cursor: pointer; font-size: 0.92rem; margin-bottom: 2px; }
  .channel-item:active { background: rgba(45, 90, 130, 0.35); }
  .channel-item.active { background: var(--accent); color: #fff; font-weight: 500; }
  .channel-item .del-btn { margin-left: auto; font-size: 0.75rem; color: #ff9b9b; opacity: 0.7; padding: 4px 8px; border-radius: 8px; background: transparent; border: none; cursor: pointer; }
  .sidebar-footer { padding: 12px; border-top: 1px solid rgba(70, 130, 200, 0.15); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .sidebar-footer button { width: 100%; padding: 11px; border-radius: 12px; border: 1px dashed #2f6d9e; background: transparent; color: #8dc9ff; font-size: 0.85rem; cursor: pointer; }
  .sidebar-footer button.danger { border-color: #7a2a2a; color: #ff9b9b; }
  .sidebar-footer button.danger:active { background: rgba(122, 42, 42, 0.2); }

  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; position: relative; }
  .chat-header { padding: calc(env(safe-area-inset-top) + 12px) 12px 12px; background: #0e1820; border-bottom: 1px solid rgba(70, 130, 200, 0.2); display: flex; align-items: center; gap: 8px; color: #c6e2ff; flex-shrink: 0; }
  .menu-btn { width: 38px; height: 38px; border-radius: 10px; background: rgba(47, 109, 158, 0.25); border: none; color: #c6e2ff; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .menu-btn:active { background: rgba(47, 109, 158, 0.5); }
  .chat-header h3 { font-weight: 500; font-size: 1rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header .bot-badge { background: #1e3f5a; border-radius: 16px; padding: 4px 10px; font-size: 0.68rem; color: #8dc9ff; border: 1px solid #2f6d9e; flex-shrink: 0; }

  .quick-buttons { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: rgba(15, 25, 35, 0.5); border-bottom: 1px solid rgba(70, 130, 200, 0.15); }
  .quick-buttons:empty { display: none; }
  .quick-btn { padding: 7px 12px; border-radius: 20px; background: var(--accent); color: #e0f0ff; border: 1px solid var(--border-accent); font-size: 0.8rem; cursor: pointer; }
  .quick-btn:active { background: var(--accent-hover); }

  .messages-area { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { align-self: flex-end; }
  .message.bot { align-self: flex-start; }
  .message.system { align-self: center; max-width: 92%; }
  .message .bubble { padding: 9px 14px; border-radius: 18px; font-size: 0.92rem; line-height: 1.45; word-break: break-word; }
  .message.user .bubble { background: var(--bubble-user); color: #e7f3ff; border-bottom-right-radius: 4px; }
  .message.bot .bubble { background: #142e40; color: #d4e9ff; border: 1px solid #2a4b62; border-left: 3px solid #3d8fd9; border-bottom-left-radius: 4px; }
  .message.system .bubble { background: rgba(40, 60, 80, 0.6); color: #9dbdd8; font-size: 0.78rem; padding: 6px 12px; border-radius: 18px; }
  .message .sender { font-size: 0.68rem; color: #7f9db8; margin-bottom: 3px; padding-left: 6px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .message.user .sender { justify-content: flex-end; padding-right: 6px; padding-left: 0; }
  .message .sender .role-tag { color: #ffd98a; }
  .message .sender .role-tag.member { color: #8dc9ff; }
  .message .sender .edit-btn {
    background: transparent;
    border: none;
    color: #7fa0bd;
    font-size: 0.7rem;
    padding: 0 4px;
    cursor: pointer;
    text-decoration: underline;
  }
  .message .sender .edit-btn:active { color: #b8e2ff; }
  .message .sender .edited-tag { font-size: 0.62rem; color: #7fa0bd; margin-left: 2px; }
  .message img.chat-image { max-width: 100%; border-radius: 12px; margin-top: 4px; cursor: pointer; display: block; }

  .hint { font-size: 0.68rem; color: #6c8ca5; text-align: center; padding: 2px 0 4px; }
  .input-area { padding: 8px 10px calc(env(safe-area-inset-bottom) + 10px); background: #0e1820; border-top: 1px solid rgba(70, 130, 200, 0.2); display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .input-area input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 50px; border: 1px solid #244a64; background: #14202e; color: #ecf5ff; font-size: 1rem; outline: none; min-width: 0; }
  .input-area input[type="text"]:focus { border-color: var(--border-accent); }
  .input-area button { background: var(--accent); border: none; color: white; padding: 0 18px; border-radius: 50px; font-weight: 600; cursor: pointer; font-size: 0.95rem; flex-shrink: 0; height: 44px; }
  .input-area button:active { transform: scale(0.97); }
  .input-area button:disabled { background: #2a3f4f; color: #6d8aa0; }
  .icon-btn { background: rgba(47, 109, 158, 0.35) !important; padding: 0 14px !important; font-size: 1.2rem !important; }
  .icon-btn:active { background: rgba(47, 109, 158, 0.6) !important; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: flex; justify-content: center; align-items: center; z-index: 110; padding: 16px; }
  .modal-backdrop.hidden { display: none; }
  .modal { background: #162635; padding: 22px; border-radius: 20px; width: 100%; max-width: 440px; border: 1px solid #2f6d9e; max-height: 85vh; overflow-y: auto; }
  .modal h3 { color: #b8e2ff; font-weight: 500; margin-bottom: 14px; font-size: 1.15rem; }
  .modal label { display: block; color: #8dc9ff; font-size: 0.78rem; margin-bottom: 6px; margin-top: 12px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #2d4b66; background: #0f1a24; color: #e0f0ff; font-size: 1rem; outline: none; -webkit-appearance: none; font-family: inherit; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #4f9eff; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .modal-actions .confirm { background: var(--accent); color: white; }
  .modal-actions .confirm:hover { background: var(--accent-hover); }
  .modal-actions .cancel { background: transparent; border: 1px solid #3d5f7a; color: #9dbdd8; }

  .empty-state { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #5f87a8; gap: 10px; font-size: 0.9rem; padding: 40px 20px; text-align: center; }
  .empty-state .big { font-size: 2.5rem; opacity: 0.5; }

  .member-item, .cmd-item, .btn-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: rgba(15, 25, 35, 0.6); border-radius: 10px; font-size: 0.85rem; margin-bottom: 6px; }
  .member-item .name { flex: 1; color: #d4e9ff; }
  .member-item .badge { font-size: 0.62rem; padding: 2px 6px; border-radius: 8px; background: var(--accent); color: #cce8ff; }
  .member-item .badge.admin { background: #8a5a1e; color: #ffe1b0; }
  .member-item .kick-btn { font-size: 0.7rem; padding: 5px 10px; background: #7a2a2a; color: #ffc5c5; border: none; border-radius: 8px; cursor: pointer; }
  .member-item.self { background: rgba(31, 90, 135, 0.4); }
  .cmd-item .cmd-name { color: #7bffb0; font-family: monospace; min-width: 70px; }
  .cmd-item .cmd-resp { flex: 1; color: #d4e9ff; font-size: 0.8rem; word-break: break-all; }
  .cmd-item .del-btn, .btn-item .del-btn { font-size: 0.7rem; padding: 5px 10px; background: #7a2a2a; color: #ffc5c5; border: none; border-radius: 8px; cursor: pointer; }
  .btn-item .btn-label { flex: 1; color: #d4e9ff; }
  .btn-item .btn-type { font-size: 0.62rem; padding: 2px 6px; border-radius: 8px; background: var(--accent); color: #cce8ff; }

  .room-code-box { padding: 16px; background: #0a1520; border: 1px dashed var(--border-accent); border-radius: 12px; color: #7bffb0; font-size: 1.5rem; font-family: monospace; text-align: center; letter-spacing: 3px; user-select: all; margin-top: 4px; }

  .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 80px); left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 12px 22px; border-radius: 30px; font-size: 0.9rem; z-index: 800; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }

  .uploading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 300; color: #b8e2ff; font-size: 1rem; }
  .uploading-overlay.hidden { display: none; }

  .toolbox-overlay { position: fixed; inset: 0; background: linear-gradient(160deg, #0f1a24 0%, #1a2a3a 100%); z-index: 500; display: none; flex-direction: column; }
  .toolbox-overlay.open { display: flex; }
  .toolbox-header { padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; background: #0e1820; border-bottom: 1px solid rgba(70, 130, 200, 0.2); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .toolbox-header h2 { flex: 1; color: #b8e2ff; font-weight: 500; font-size: 1.15rem; }
  .toolbox-close { width: 38px; height: 38px; border-radius: 10px; background: rgba(47, 109, 158, 0.25); border: none; color: #c6e2ff; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .toolbox-close:active { background: rgba(47, 109, 158, 0.5); }
  .toolbox-tabs { display: flex; gap: 6px; padding: 10px 12px; background: rgba(15, 25, 35, 0.5); overflow-x: auto; flex-shrink: 0; border-bottom: 1px solid rgba(70, 130, 200, 0.15); }
  .toolbox-tab { padding: 8px 14px; border-radius: 20px; background: rgba(47, 109, 158, 0.2); color: #b8d4ec; border: 1px solid transparent; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
  .toolbox-tab.active { background: var(--accent); color: #fff; border-color: var(--border-accent); }
  .toolbox-content { flex: 1; overflow-y: auto; padding: 16px; }
  .toolbox-panel { display: none; }
  .toolbox-panel.active { display: block; }

  .timer-display { font-size: 3rem; font-family: monospace; text-align: center; color: #e0f0ff; padding: 20px; letter-spacing: 2px; }
  .timer-switch { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .timer-switch button { padding: 8px 16px; border-radius: 20px; border: 1px solid #2d4b66; background: transparent; color: #8dc9ff; cursor: pointer; font-size: 0.9rem; }
  .timer-switch button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .timer-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .timer-input-row input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #2d4b66; background: #0f1a24; color: #e0f0ff; font-size: 1rem; outline: none; }
  .timer-actions { display: flex; gap: 8px; }
  .timer-actions button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .timer-actions .primary { background: var(--accent); color: white; }
  .timer-actions .secondary { background: rgba(47, 109, 158, 0.3); color: #cce8ff; border: 1px solid #2f6d9e; }
  .timer-actions .danger { background: #7a2a2a; color: #ffc5c5; }

  .notes-area { width: 100%; min-height: 60vh; padding: 14px; border-radius: 12px; border: 1px solid #2d4b66; background: #0f1a24; color: #e0f0ff; font-size: 1rem; font-family: inherit; outline: none; resize: vertical; line-height: 1.5; }

<script>
(function() {
  'use strict';

  // ========== PWA ==========
  (function setupPWA() {
    const manifest = {
      name: 'MDHS|ADMIN',

        sizes: '192x192',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'mdhs-admin-v11';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET') return;
          e.respondWith(
            caches.open(CACHE_NAME).then(cache =>
              fetch(e.request).then(res => {
                if (res && res.status === 200 && res.type === 'basic') cache.put(e.request, res.clone());
                return res;
              }).catch(() => cache.match(e.request))
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }
  })();

  const SB_URL = 'https://ixmkbqpdugazdxbqogxw.supabase.co';
  const SB_KEY = 'sb_publishable_LuHQhy3xbv4b0ko02AZAyA_zCf7mB59';
  const sb = window.supabase.createClient(SB_URL, SB_KEY);

  // ========== 匿名登入 ==========
  let AUTH_UID = null;
  async function ensureAuth() {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        AUTH_UID = session.user.id;
        console.log('已登入，uid =', AUTH_UID);
        return AUTH_UID;
      }
      const { data, error } = await sb.auth.signInAnonymously();
      if (error) {
        console.error('匿名登入失敗：', error);
        return null;
      }
      AUTH_UID = data.user.id;
      console.log('匿名登入成功，uid =', AUTH_UID);
      return AUTH_UID;
    } catch (err) {
      console.error('ensureAuth 錯誤：', err);
      return null;
    }
  }

  function getUserId() {
    let uid = localStorage.getItem('chat_user_id');
    if (!uid) {
      uid = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('chat_user_id', uid);
    }
    return uid;
  }
  const USER_ID = getUserId();

  function getMyTokens() {
    try { return JSON.parse(localStorage.getItem('chat_tokens') || '{}'); } catch(e) { return {}; }
  }
  function saveToken(roomId, token) {
    const t = getMyTokens(); t[roomId] = token;
    localStorage.setItem('chat_tokens', JSON.stringify(t));
  }
  function removeToken(roomId) {
    const t = getMyTokens(); delete t[roomId];
    localStorage.setItem('chat_tokens', JSON.stringify(t));
  }

  function getMyRooms() {
    try { return JSON.parse(localStorage.getItem('chat_my_rooms') || '[]'); } catch(e) { return []; }
  }
  function addMyRoom(room) {
    const rooms = getMyRooms();
    if (!rooms.find(r => r.id === room.id)) {
      rooms.push({ id: room.id, name: room.name, code: room.code });
    } else {
      const idx = rooms.findIndex(r => r.id === room.id);
      rooms[idx].name = room.name;
      rooms[idx].code = room.code;
    }
    localStorage.setItem('chat_my_rooms', JSON.stringify(rooms));
  }
  function removeMyRoom(roomId) {
    const rooms = getMyRooms().filter(r => r.id !== roomId);
    localStorage.setItem('chat_my_rooms', JSON.stringify(rooms));
  }

  let currentRoom = null, currentChannel = null;

  let channels = [], messages = [], members = [], customCmds = [], customBtns = [];

  let isJoining = false;

  const $ = id => document.getElementById(id);
  const loadingScreen = $('loadingScreen');
  const joinOverlay = $('joinOverlay'), joinTitle = $('joinTitle'), joinSubtitle = $('joinSubtitle');
  const joinFields = $('joinFields'), createFields = $('createFields');

  const tokenDisplay = $('tokenDisplay');
  const currentRoomNameEl = $('currentRoomName'), roleBadge = $('roleBadge');
  const myRoomsListEl = $('myRoomsList'), addRoomBtn = $('addRoomBtn');
  const channelListEl = $('channelList'), addChannelBtn = $('addChannelBtn'), viewMembersBtn = $('viewMembersBtn');
  const manageCmdsBtn = $('manageCmdsBtn'), manageBtnsBtn = $('manageBtnsBtn');
  const channelTitle = $('channelTitle'), messagesArea = $('messagesArea');

  const uploadImageBtn = $('uploadImageBtn'), imageFileInput = $('imageFileInput'), uploadingOverlay = $('uploadingOverlay');

  async function saveEditMsg() {

    const newText = editMsgInput.value.trim();

    editMsgError.textContent = '儲存中...';
    const { error } = await sb.from('messages').update({

      edited: true,

    }).eq('id', editingMsgId);
    if (error) {
      editMsgError.textContent = '❌ 儲存失敗：' + error.message;
      return;

    const idx = messages.findIndex(m => m.id === editingMsgId);
    if (idx >= 0) {
      messages[idx].text = escapeHtml(newText);

  // ----- 計時器 -----
  let timerMode = 'countdown';
  let timerInterval = null;
  let timerRemaining = 0;
  let stopwatchElapsed = 0;
  const timerDisplay = $('timerDisplay');
  const timerStartBtn = $('timerStartBtn');
  const timerPauseBtn = $('timerPauseBtn');
  const timerResetBtn = $('timerResetBtn');
  const countdownInputRow = $('countdownInputRow');
  const timerModeCountdown = $('timerModeCountdown');
  const timerModeStopwatch = $('timerModeStopwatch');
  const countdownMin = $('countdownMin');
  const countdownSec = $('countdownSec');

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }
  function renderTimer() {
    if (timerMode === 'countdown') timerDisplay.textContent = formatTime(timerRemaining);
    else timerDisplay.textContent = formatTime(stopwatchElapsed);
  }
  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  timerModeCountdown.addEventListener('click', () => {
    timerMode = 'countdown';
    timerModeCountdown.classList.add('active');
    timerModeStopwatch.classList.remove('active');
    countdownInputRow.style.display = 'flex';
    stopTimer();
    timerRemaining = 0;
    renderTimer();
  });
  timerModeStopwatch.addEventListener('click', () => {
    timerMode = 'stopwatch';
    timerModeStopwatch.classList.add('active');
    timerModeCountdown.classList.remove('active');
    countdownInputRow.style.display = 'none';
    stopTimer();
    stopwatchElapsed = 0;
    renderTimer();
  });

  timerStartBtn.addEventListener('click', () => {
    if (timerMode === 'countdown') {
      if (timerRemaining <= 0) {
        const m = parseInt(countdownMin.value) || 0;
        const s = parseInt(countdownSec.value) || 0;
        timerRemaining = (m * 60 + s) * 1000;
        if (timerRemaining <= 0) { alert('請輸入時間'); return; }
      }
      if (timerInterval) return;
      const startTime = Date.now();
      const initialRemaining = timerRemaining;
      timerInterval = setInterval(() => {
        timerRemaining = initialRemaining - (Date.now() - startTime);
        if (timerRemaining <= 0) {
          timerRemaining = 0;
          stopTimer();
          renderTimer();
          try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch(e) {}
          alert('⏰ 時間到！');
        } else {
          renderTimer();
        }
      }, 100);
    } else {
      if (timerInterval) return;
      const startTime = Date.now() - stopwatchElapsed;
      timerInterval = setInterval(() => {
        stopwatchElapsed = Date.now() - startTime;
        renderTimer();
      }, 50);
    }
  });
  timerPauseBtn.addEventListener('click', stopTimer);
  timerResetBtn.addEventListener('click', () => {
    stopTimer();
    timerRemaining = 0;
    stopwatchElapsed = 0;
    countdownMin.value = '';
    countdownSec.value = '';
    renderTimer();
  });
  renderTimer();

  // ----- 計算機 -----
  let calcExpr = '';
  const calcDisplay = $('calcDisplay');
  document.querySelectorAll('.calc-grid button').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.calc;
      if (v === 'C') {
        calcExpr = '';
      } else if (v === '⌫') {
        calcExpr = calcExpr.slice(0, -1);
      } else if (v === '=') {
        try {
          if (!calcExpr) return;
          if (!/^[\d+\-*/.%() ]+$/.test(calcExpr)) throw new Error('invalid');
          let expr = calcExpr.replace(/%/g, '/100');
          const result = Function('"use strict";return (' + expr + ')')();
          if (!isFinite(result)) throw new Error('nan');
          calcExpr = String(result);
        } catch (e) {
          calcExpr = '錯誤';
        }
      } else {
        if (calcExpr === '錯誤') calcExpr = '';
        calcExpr += v;
      }
      calcDisplay.textContent = calcExpr || '0';
    });
  });

  // ----- 倒數日 -----
  const countdownDate = $('countdownDate');
  const countdownDays = $('countdownDays');
  const countdownTarget = $('countdownTarget');

  function updateCountdown() {
    if (!countdownDate.value) {
      countdownDays.textContent = '--';
      countdownTarget.textContent = '請選擇日期';
      return;
    }
    const target = new Date(countdownDate.value + 'T00:00:00');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.round((target - today) / (24 * 60 * 60 * 1000));
    countdownDays.textContent = diff;
    countdownTarget.textContent = '目標日期：' + countdownDate.value;
  }
  const savedDate = localStorage.getItem('toolbox_countdown_date');
  if (savedDate) { countdownDate.value = savedDate; }

    if (n === '管理員') return { ok: false, msg: '暱稱不能叫「管理員」' };
    if (n.length > 12) return { ok: false, msg: '暱稱不能超過 12 個字' };

    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      codeError.textContent = '✅ 已複製！';

    let joinChannel = channels.find(c => c.name === '加入');
    if (!joinChannel) joinChannel = channels[0];
    if (!joinChannel) return;
    await sb.from('messages').insert({
      channel_id: joinChannel.id,
      text: text,
      sender: 'system',
      sender_id: AUTH_UID,
      is_system: true

  function renderChannelList() {
    if (!channels.length) { channelListEl.innerHTML = ''; return; }
    let html = '';
    const normal = channels.filter(c => c.type !== 'forum');
    const forums = channels.filter(c => c.type === 'forum');
    if (normal.length) {
      html += '<div class="channel-section-title">頻道</div>';
      normal.forEach(ch => html += channelItemHtml(ch));
    }
    if (forums.length) {
      html += '<div class="channel-section-title">討論區</div>';
      forums.forEach(ch => html += channelItemHtml(ch));
    }
    channelListEl.innerHTML = html;
    channelListEl.querySelectorAll('.channel-item').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.classList.contains('del-btn')) return;
        switchChannel(el.dataset.channelId);
        closeDrawer();
      });
    });
    channelListEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const chId = btn.dataset.channelId;
        const ch = channels.find(c => c.id === chId);
        if (!ch) return;
        if (!isAdmin()) { alert('只有管理員可以刪除頻道'); return; }
        if (ch.name === '加入') { alert('「加入」頻道無法刪除'); return; }
        if (!confirm('確定要刪除此頻道嗎？')) return;
        await sb.from('channels').delete().eq('id', chId);
        await loadChannels(currentRoom.id);
        if (!channels.find(c => c.id === currentChannel?.id)) {
          if (channels.length) switchChannel(channels[0].id);
          else { currentChannel = null; renderMessages(); }
        }
      });
    });
  }
  function channelItemHtml(ch) {
    const active = ch.id === currentChannel?.id ? 'active' : '';
    const canDelete = isAdmin() && ch.name !== '加入';
    const delBtn = canDelete ? `<button class="del-btn" data-channel-id="${ch.id}">✕</button>` : '';
    return `<div class="channel-item ${active}" data-channel-id="${ch.id}">
      <span>${channelIcon(ch.type)}</span><span>${escapeHtml(ch.name)}</span>${delBtn}
    </div>`;
  }

  function getRoleOfSender(senderName) {
    const m = members.find(x => x.nickname === senderName);
    return m ? m.role : 'member';
  }
  function renderMessages() {
    if (!currentChannel) {
      messagesArea.innerHTML = `<div class="empty-state"><div class="big">💬</div><div>請選擇一個頻道</div></div>`;
      return;
    }
    if (!messages.length) {
      messagesArea.innerHTML = `<div class="empty-state"><div class="big">✨</div><div>這個頻道還沒有訊息</div></div>`;
      return;
    }
    let html = '';
    messages.forEach(msg => {
      if (msg.is_system) {
        html += `<div class="message system"><div class="bubble">${escapeHtml(msg.text)}</div></div>`;
      } else {
        const cls = msg.is_bot ? 'bot' : 'user';
        const isMine = !msg.is_bot && msg.sender === currentUser.nickname;
        const isImage = msg.text && msg.text.startsWith(IMG_PREFIX);
        let label = '';
        if (msg.is_bot) {
          label = '🤖 小幫手';
        } else {
          const role = getRoleOfSender(msg.sender);
          const roleTag = role === 'admin'
            ? '<span class="role-tag">[管理員]</span>'
            : '<span class="role-tag member">[成員]</span>';
          label = `${escapeHtml(msg.sender)} ${roleTag}`;
        }
        const editedTag = msg.edited ? '<span class="edited-tag">（已編輯）</span>' : '';
        const editBtn = (isMine && !isImage)
          ? `<button class="edit-btn" data-msg-id="${msg.id}">✏️ 編輯</button>`
          : '';
        let contentHtml = '';
        if (isImage) {
          const imgUrl = msg.text.substring(IMG_PREFIX.length);
          contentHtml = `<img class="chat-image" src="${escapeHtml(imgUrl)}" onclick="window.open('${escapeHtml(imgUrl)}','_blank')">`;
        } else {
          contentHtml = escapeHtml(msg.text).replace(/\n/g, '<br>');
        }
        html += `<div class="message ${cls}" data-msg-id="${msg.id}">
          <div class="sender">${label}${editedTag}${editBtn}</div>
          <div class="bubble">${contentHtml}</div>
        </div>`;
      }
    });
    messagesArea.innerHTML = html;
    messagesArea.scrollTop = messagesArea.scrollHeight;

    messagesArea.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        openEditMsgModal(btn.dataset.msgId);
      });
    });

  function renderMembers() {

      memberList.innerHTML = '<div style="color:#7f9db8;text-align:center;padding:20px;">目前沒有成員</div>';
      return;

    let html = '';
    members.forEach(m => {

      const kickBtn = (isAdmin() && !isSelf && !isMemberAdmin)
        ? `<button class="kick-btn" data-user-id="${m.user_id}">踢出</button>` : '';

      html += `<div class="member-item ${isSelf ? 'self' : ''}">
        <span class="name">${escapeHtml(m.nickname)}${selfTag}</span>
        <span class="badge ${isMemberAdmin ? 'admin' : ''}">${isMemberAdmin ? '管理員' : '成員'}</span>

        if (b.action_type === 'link') {

          navigator.clipboard.writeText(b.action_value).then(() => {
            showToast('✅ 已複製：' + b.action_value.substring(0, 30) + (b.action_value.length > 30 ? '...' : ''));
          }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = b.action_value;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ 已複製');
          });
        }
      });
    });

  async function joinRoomByCode(code, nickname, skipValidation) {
    if (isJoining) return;
    isJoining = true;
    try {
      code = (code || '').trim().toLowerCase();
      if (!code) { errorMsg.textContent = '請輸入聊天室代碼'; return; }

      if (!skipValidation) {
        const v = validateNickname(nickname);
        if (!v.ok) { errorMsg.textContent = v.msg; return; }
        nickname = v.name;
      }

      errorMsg.textContent = '載入中...';
      await cleanupExpiredRooms();

      const room = await findRoomByCode(code);
      if (!room) { errorMsg.textContent = '找不到此聊天室'; return; }

      const tokenValue = tokenInput.value.trim();
      const savedToken = getMyTokens()[room.id];
      const hasValidToken = (tokenValue && tokenValue === room.admin_token) || (savedToken && savedToken === room.admin_token);

      const { data: myMembership } = await sb.from('members')
        .select('*').eq('room_id', room.id).eq('user_id', USER_ID).maybeSingle();

      let role = 'member';

      if (myMembership && !hasValidToken) {
        role = myMembership.role;
      } else if (hasValidToken) {
        const otherAdmin = await findOtherAdminIncludingSelf(room.id);
        if (otherAdmin && otherAdmin.user_id !== USER_ID) {
          await sb.from('members').delete()
            .eq('room_id', room.id)
            .eq('user_id', otherAdmin.user_id);
        }
        role = 'admin';
        if (tokenValue) saveToken(room.id, tokenValue);
        showToast('✅ 已用 Token 恢復管理員身分');
      } else {
        role = 'member';
        if (tokenValue && tokenValue !== room.admin_token) {
          errorMsg.textContent = 'Token 錯誤，將以一般成員身分加入';
          await new Promise(r => setTimeout(r, 800));
        }
      }

      currentRoom = room;
      currentUser = { nickname, role };
      localStorage.setItem('chat_last_room_code', code);
      localStorage.setItem('chat_last_nickname', nickname);
      addMyRoom(room);

      joinOverlay.classList.add('hidden');
      updateRoomUI();
      renderMyRooms();

      await touchRoom();
      await loadChannels(room.id);
      await loadMembers(room.id);
      await loadCmds(room.id);
      await loadBtns(room.id);

      await sb.from('members').upsert({
        room_id: room.id,
        user_id: USER_ID,
        auth_id: AUTH_UID,
        nickname: nickname,
        role: role,
        last_seen: new Date().toISOString()
      }, { onConflict: 'room_id,user_id' });

      if (channels.length) {
        switchChannel(channels[0].id);
        await sendSystemMessage(`${nickname} 加入了聊天室`);
      } else {
        const { data } = await sb.from('channels').insert({ room_id: room.id, name: '一般', type: 'text' }).select().single();
        if (data) { await loadChannels(room.id); switchChannel(data.id); }
      }

      messageInput.disabled = false;
      sendBtn.disabled = false;
      uploadImageBtn.disabled = false;
      messageInput.placeholder = '輸入訊息...';
      subscribeRealtime();
      startHeartbeat();
    } catch (err) {
      console.error(err);
      errorMsg.textContent = '載入失敗：' + (err.message || '未知錯誤');
    } finally {
      isJoining = false;
    }
  }

  async function tryCreateRoom() {
    const name = newRoomName.value.trim();
    const code = newRoomCode.value.trim().toLowerCase();
    const nickname = newRoomNickname.value.trim();

    if (!name || !code) { errorMsg.textContent = '請填寫名稱與代碼'; return; }
    const v = validateNickname(nickname);
    if (!v.ok) { errorMsg.textContent = v.msg; return; }

    errorMsg.textContent = '建立中...';
    await cleanupExpiredRooms();

    const existing = await findRoomByCode(code);
    if (existing) { errorMsg.textContent = '此代碼已被使用'; return; }

    const adminToken = 'adm_' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
    const { data: room, error } = await sb.from('rooms').insert({ name, code, admin_token: adminToken }).select().single();
    if (error || !room) { errorMsg.textContent = '建立失敗：' + (error?.message || ''); return; }

    await sb.from('channels').insert([
      { room_id: room.id, name: '加入', type: 'announcement' },
      { room_id: room.id, name: '一般', type: 'text' },
      { room_id: room.id, name: '討論區', type: 'forum' }
    ]);

    currentRoom = room;
    currentUser = { nickname: v.name, role: 'admin' };
    saveToken(room.id, adminToken);
    localStorage.setItem('chat_last_room_code', code);
    localStorage.setItem('chat_last_nickname', v.name);
    addMyRoom(room);

    joinOverlay.classList.add('hidden');
    updateRoomUI();
    renderMyRooms();
    await loadChannels(room.id);
    await loadMembers(room.id);
    await loadCmds(room.id);
    await loadBtns(room.id);
    await sb.from('members').upsert({
      room_id: room.id, user_id: USER_ID, auth_id: AUTH_UID,
      nickname: v.name, role: 'admin', last_seen: new Date().toISOString()
    }, { onConflict: 'room_id,user_id' });

    switchChannel(channels[0].id);
    await sendSystemMessage(`聊天室「${name}」已建立！${v.name} 是管理員。`);

    tokenDisplay.innerHTML = `<div class="token-display">🔑 Token（請保存）：<br>${adminToken}</div>`;
    alert('🎉 聊天室已建立！\n\n管理員 Token：\n' + adminToken + '\n\n請保存好！下次加入時貼上即可恢復管理員身分。\n\n📌 此聊天室若 7 天無人使用，將自動刪除並釋放代碼。');

    messageInput.disabled = false;
    sendBtn.disabled = false;
    uploadImageBtn.disabled = false;
    messageInput.placeholder = '輸入訊息...';
    subscribeRealtime();
    startHeartbeat();
  }

  function subscribeRealtime() {
    if (rtMessages) sb.removeChannel(rtMessages);
    if (rtMembers) sb.removeChannel(rtMembers);
    if (rtCmds) sb.removeChannel(rtCmds);
    if (rtBtns) sb.removeChannel(rtBtns);

    rtMessages = sb.channel('rt-messages-' + currentRoom.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const m = payload.new;
        if (currentChannel && m.channel_id === currentChannel.id) {
          messages.push(m);
          renderMessages();
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {
        const m = payload.new;
        if (currentChannel && m.channel_id === currentChannel.id) {
          const idx = messages.findIndex(x => x.id === m.id);
          if (idx >= 0) { messages[idx] = m; renderMessages(); }
        }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'channels' }, async () => {
        if (currentRoom) {
          await loadChannels(currentRoom.id);
          if (!channels.length) { currentChannel = null; renderMessages(); }
          else if (!channels.find(c => c.id === currentChannel?.id)) switchChannel(channels[0].id);
        }
      })
      .subscribe();

    rtMembers = sb.channel('rt-members-' + currentRoom.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, async payload => {
        if (payload.eventType === 'DELETE' && payload.old && payload.old.user_id === USER_ID) {
          alert('您已被管理員踢出此聊天室');
          removeMyRoom(currentRoom.id);
          localStorage.removeItem('chat_last_room_code');
          localStorage.removeItem('chat_last_nickname');
          location.reload();
          return;
        }
        if (currentRoom) await loadMembers(currentRoom.id);
      })
      .subscribe();

    rtCmds = sb.channel('rt-cmds-' + currentRoom.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'custom_commands' }, async () => {
        if (currentRoom) await loadCmds(currentRoom.id);
      })
      .subscribe();

    rtBtns = sb.channel('rt-btns-' + currentRoom.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'custom_buttons' }, async () => {
        if (currentRoom) await loadBtns(currentRoom.id);
      })
      .subscribe();
  }

  function startHeartbeat() {

      await sb.from('members').update({ last_seen: new Date().toISOString() })
        .eq('room_id', currentRoom.id).eq('user_id', USER_ID);
      await touchRoom();
    }, 30000);
  }

  uploadImageBtn.addEventListener('click', () => {

  imageFileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !currentChannel) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('圖片不能超過 5MB');
      imageFileInput.value = '';
      return;

    uploadingOverlay.classList.remove('hidden');
    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const fileName = `${USER_ID}_${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('chat-images').upload(fileName, file, {
        cacheControl: '3600', upsert: false
      });
      if (error) throw error;
      const { data: urlData } = sb.storage.from('chat-images').getPublicUrl(fileName);
      const publicUrl = urlData.publicUrl;
      await sb.from('messages').insert({
        channel_id: currentChannel.id,
        text: IMG_PREFIX + publicUrl,
        sender: currentUser.nickname,
        sender_id: AUTH_UID,
        is_bot: false, is_system: false
      });
      await touchRoom();
      showToast('✅ 圖片已傳送');
    } catch (err) {
      console.error(err);
      showToast('❌ 上傳失敗：' + (err.message || '未知錯誤'));
    } finally {
      uploadingOverlay.classList.add('hidden');
      imageFileInput.value = '';
    }
  });

  function handleBotCommand(cmd, full) {
    const c = cmd.trim().toLowerCase();
    const custom = customCmds.find(x => x.command.toLowerCase() === c);
    if (custom) return custom.response;

    if (c === '/規則' || c === '/rule') return `📋 聊天室規則：\n1. 尊重所有成員\n2. 禁止洗版廣告\n3. 保持友善\n4. 使用 /help 查看指令`;
    if (c === '/help' || c === '/幫助') {
      let help = `🤖 可用指令：\n/規則 - 規則\n/help - 幫助\n/時間 - 時間\n/問候 - 打招呼\n/頻道 - 列出頻道`;
      if (isAdmin()) help += `\n\n👑 管理員指令：\n/set /指令名 回應內容\n/del /指令名`;
      if (customCmds.length) help += `\n\n📝 自訂指令：\n` + customCmds.map(x => x.command).join(', ');
      return help;
    }
    if (c === '/時間' || c === '/time') return `🕒 現在時間：${new Date().toLocaleTimeString('zh-TW', { hour12: false })}`;
    if (c === '/問候' || c === '/hello') return `你好呀，${escapeHtml(currentUser.nickname)}！`;
    if (c === '/頻道' || c === '/channels') return `📁 頻道：\n${channels.map(ch => `${channelIcon(ch.type)} ${ch.name}`).join('\n')}`;
    if (c.startsWith('/')) return `❓ 未知指令「${full}」。輸入 /help 查看幫助。`;
    return null;
  }

  async function sendUserMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentChannel) return;

    if (isAdmin() && text.startsWith('/set ')) {
      const rest = text.substring(5).trim();
      const spaceIdx = rest.indexOf(' ');
      if (spaceIdx === -1) { showToast('格式：/set /指令名 回應內容'); return; }
      let cmdName = rest.substring(0, spaceIdx).trim();
      const resp = rest.substring(spaceIdx + 1).trim();
      if (!cmdName.startsWith('/')) cmdName = '/' + cmdName;
      await sb.from('custom_commands').upsert({ room_id: currentRoom.id, command: cmdName, response: resp }, { onConflict: 'room_id,command' });
      await loadCmds(currentRoom.id);
      messageInput.value = '';
      showToast('✅ 已設定指令 ' + cmdName);
      return;
    }
    if (isAdmin() && text.startsWith('/del ')) {
      let cmdName = text.substring(5).trim();
      if (!cmdName.startsWith('/')) cmdName = '/' + cmdName;
      await sb.from('custom_commands').delete().eq('room_id', currentRoom.id).eq('command', cmdName);
      await loadCmds(currentRoom.id);
      messageInput.value = '';
      showToast('✅ 已刪除指令 ' + cmdName);
      return;
    }

    await sb.from('messages').insert({
      channel_id: currentChannel.id,
      text: escapeHtml(text),
      sender: currentUser.nickname,
      sender_id: AUTH_UID,
      is_bot: false, is_system: false
    });
    await touchRoom();
    messageInput.value = '';

    if (text.startsWith('/')) {
      const reply = handleBotCommand(text, text);
      if (reply) {
        setTimeout(async () => {
          await sb.from('messages').insert({
            channel_id: currentChannel.id,
            text: escapeHtml(reply),
            sender: '小幫手', is_bot: true, is_system: false
          });
        }, 200);
      }
    }
  }

  joinBtn.addEventListener('click', () => {
    if (isCreateMode) tryCreateRoom();
    else joinRoomByCode(roomCodeInput.value, nicknameInput.value);
  });
  switchToCreateBtn.addEventListener('click', () => setCreateMode(!isCreateMode));

  [roomCodeInput, nicknameInput, tokenInput, newRoomName, newRoomCode, newRoomNickname].forEach(inp => {
    if (inp) inp.addEventListener('keypress', e => {
      if (e.key === 'Enter') { e.preventDefault(); joinBtn.click(); }
    });
  });

  sendBtn.addEventListener('click', sendUserMessage);
  messageInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendUserMessage(); }
  });

  addChannelBtn.addEventListener('click', openChannelModal);
  cancelChannelBtn.addEventListener('click', closeChannelModal);
  confirmChannelBtn.addEventListener('click', confirmAddChannel);
  viewMembersBtn.addEventListener('click', openMembersModal);
  closeMembersBtn.addEventListener('click', closeMembersModal);
  manageCmdsBtn.addEventListener('click', openCmdsModal);
  closeCmdsBtn.addEventListener('click', closeCmdsModal);
  addCmdBtn.addEventListener('click', addCmd);
  manageBtnsBtn.addEventListener('click', openBtnsModal);
  closeBtnsBtn.addEventListener('click', closeBtnsModal);
  addBtnBtn.addEventListener('click', addBtn);

  addRoomBtn.addEventListener('click', () => {
    closeDrawer();
    joinOverlay.classList.remove('hidden');
    setCreateMode(false);
    roomCodeInput.value = '';
    roomCodeInput.focus();
  });

    async function init() {
    ensureAuth().catch(e=>console.warn(e));
    renderMyRooms();
    loadingScreen.classList.add('hidden');
    joinOverlay.classList.remove('hidden');
    roomCodeInput.focus();
  }

  init();
})();
</script>
</body>
</html>
